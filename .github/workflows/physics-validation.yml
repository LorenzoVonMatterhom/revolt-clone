name: Physics Validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physics:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Antenna spring regressions
        run: node --test tests/antenna.test.js
      - name: Wheel collision regressions
        run: node --test tests/wheel-collisions.test.js
      - name: Swimming pool water regressions
        run: node --test tests/water.test.js
      - run: npm test
