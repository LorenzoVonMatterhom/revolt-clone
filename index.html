<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Re-Volt Three Clone</title>
  </head>
  <body>
    <div id="game" class="menu-open">
      <canvas id="scene"></canvas>
      <div class="hud hud-top">
        <div class="brand">
          <span class="kicker">Three.js RC racer</span>
          <strong>Re-Volt Clone</strong>
        </div>
        <div class="readouts">
          <div><span>Speed</span><strong id="speed">0</strong></div>
          <div><span>Lap</span><strong id="lap">1/3</strong></div>
          <div><span>Place</span><strong id="place">1/4</strong></div>
          <div><span>Time</span><strong id="time">00:00</strong></div>
        </div>
      </div>
      <div class="hud hud-left">
        <select id="levelSelect" title="Choose level" aria-label="Choose level"></select>
        <button id="cameraBtn" type="button" title="Switch camera">Camera</button>
        <button id="resetBtn" type="button" title="Reset car">Reset</button>
        <button id="nextLevelBtn" type="button" title="Next level">Next Level</button>
        <button id="muteBtn" type="button" title="Toggle sound">Sound</button>
        <button id="menuBtn" type="button">Menu</button>
      </div>
      <div class="hud minimap" aria-hidden="true">
        <canvas id="map" width="180" height="180"></canvas>
      </div>
      <section class="hud debug-panel" id="debugPanel" aria-label="Temporary debugging panel">
        <h2>Debug <span>Temporary</span></h2>
        <label for="debugPowerup">Power-up</label>
        <select id="debugPowerup" aria-label="Debug power-up"></select>
        <div class="debug-actions">
          <button id="debugGive" type="button">Give</button>
          <button id="debugUse" type="button">Use</button>
          <button id="debugClear" type="button">Clear</button>
        </div>
        <output id="debugStatus" aria-live="polite">No Pick Up</output>
      </section>
      <div class="hud powerup-slot">
        <button id="powerBtn" type="button" disabled aria-label="Use power-up" title="Use power-up (F or left Ctrl)"><canvas id="powerIcon" width="64" height="64" aria-hidden="true"></canvas></button>
        <div><strong id="powerName">No Pick Up</strong><span id="powerStatus" role="status"></span></div>
      </div>
      <div class="help" id="help">
        <span>WASD / arrows drive</span>
        <span>Space handbrake</span>
        <span>R reset</span>
      </div>
      <div class="start" id="start">
        <div class="start-panel">
          <h1>Re-Volt</h1>
          <h2>Select Car</h2>
          <div class="car-selector"><button id="prevCar" aria-label="Previous car" title="Previous car">&#9664;</button><select id="carSelect" aria-label="Select car"></select><button id="nextCar" aria-label="Next car" title="Next car">&#9654;</button></div>
          <h3 id="carName">RC Bandit</h3>
          <dl id="carStats"></dl>
          <label class="track-label" for="menuTrack">Track</label>
          <select id="menuTrack" aria-label="Select track"></select>
          <p id="startDescription" role="status">Loading showroom...</p>
          <button id="startBtn" type="button">Start Race</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
