<script type="text/plain" data-game-module="revolt.js">
import * as THREE from "three";
import { collisionMesh } from "./collision-mesh.js";
import { PoolWater } from "./pool-water.js";
import { FlexibleAntenna } from "./car-effects.js";
import { gameAssetUrl } from "./assets.js";
import { computeBoundsTree, acceleratedRaycast } from "three-mesh-bvh";

export const RV_SCALE = 0.1;

class Reader {
  constructor(buffer) { this.view = new DataView(buffer); this.offset = 0; }
  u16() { const v = this.view.getUint16(this.offset, true); this.offset += 2; return v; }
  i16() { const v = this.view.getInt16(this.offset, true); this.offset += 2; return v; }
  i32() { const v = this.view.getInt32(this.offset, true); this.offset += 4; return v; }
  f32() { const v = this.view.getFloat32(this.offset, true); this.offset += 4; return v; }
  vec() { return [this.f32(), this.f32(), this.f32()]; }
}

export function parseMesh(reader, world = false) {
  if (world) reader.offset += 40;
  const polygonCount = reader.u16(), vertexCount = reader.u16();
  const polygons = [];
  for (let i = 0; i < polygonCount; i++) {
    const flags = reader.u16(), texture = reader.i16();
    const indices = Array.from({ length: 4 }, () => reader.u16());
    const colors = [];
    for (let j = 0; j < 4; j++) {
      const o = reader.offset;
      colors.push([reader.view.getUint8(o + 2), reader.view.getUint8(o + 1), reader.view.getUint8(o), 255 - reader.view.getUint8(o + 3)]);
      reader.offset += 4;
    }
    const uv = Array.from({ length: 4 }, () => [reader.f32(), reader.f32()]);
    polygons.push({ flags, texture, indices, colors, uv });
  }
  const vertices = Array.from({ length: vertexCount }, () => ({ position: reader.vec(), normal: reader.vec() }));
  for (const p of polygons) {
    for (const index of p.indices.slice(0, p.flags & 1 ? 4 : 3)) {
      if (index >= vertexCount) throw new Error("Invalid Re-Volt vertex index");
    }
  }
  return { polygons, vertices };
}

export function parseWorld(buffer) {
  const r = new Reader(buffer), count = r.i32();
  const meshes = Array.from({ length: count }, () => parseMesh(r, true));
  const cubes = r.i32();
  for (let i = 0; i < cubes; i++) { r.offset += 16; const count = r.i32(); r.offset += count * 4; }
  const animations = [];
  if (r.offset < buffer.byteLength) {
    const count = r.i32();
    for (let i = 0; i < count; i++) {
      const frames = r.i32();
      animations.push(Array.from({ length: frames }, () => ({ texture: r.i32(), delay: r.f32(), uv: Array.from({ length: 4 }, () => [r.f32(), r.f32()]) })));
    }
  }
  return { meshes, animations };
}

export function parsePrm(buffer) { return parseMesh(new Reader(buffer)); }

export function parseObjects(buffer, origin = [0, 0, 0]) {
  const reader = new Reader(buffer);
  const count = reader.i32();
  if (count < 0 || buffer.byteLength !== 4 + count * 56) throw new Error("Invalid Re-Volt FOB object file");
  return Array.from({ length: count }, () => ({
    type: reader.i32(), flags: Array.from({ length: 4 }, () => reader.i32()),
    position: new THREE.Vector3(...converted(reader.vec(), origin)),
    up: reader.vec(), forward: reader.vec(),
  }));
}

export function resolveModel(name, files) {
  const matches = files.filter((p) => p.toLowerCase().split("/").at(-1).startsWith(name) && p.endsWith(".prm"));
  const exact = matches.find((p) => p.toLowerCase().endsWith(`/${name}.prm`) || p.toLowerCase() === `${name}.prm`);
  // The original FIN name is limited to eight characters. Match the base model before numbered variants.
  return exact ?? matches.sort((a, b) => a.length - b.length || a.localeCompare(b))[0];
}

export function parseInstances(buffer) {
  const r = new Reader(buffer), count = r.i32();
  return Array.from({ length: count }, () => {
    const offset = r.offset;
    const name = new TextDecoder().decode(new Uint8Array(buffer, offset, 9)).split("\0")[0].toLowerCase();
    const tint = [9, 10, 11].map((i) => (128 + r.view.getInt8(offset + i)) / 255);
    const flags = r.view.getUint8(offset + 17);
    r.offset += 24;
    return { name, tint, flags, position: r.vec(), matrix: [...r.vec(), ...r.vec(), ...r.vec()] };
  });
}

export function parsePositions(buffer) {
  if (buffer.byteLength < 12) return [];
  const r = new Reader(buffer), count = r.i32(), start = r.i32();
  r.f32();
  const nodes = Array.from({ length: count }, () => ({ position: r.vec(), distance: r.f32(), prev: Array.from({ length: 4 }, () => r.i32()), next: Array.from({ length: 4 }, () => r.i32()) }));
  const path = [], seen = new Set();
  let index = start;
  while (nodes[index] && !seen.has(index)) {
    seen.add(index); path.push(nodes[index].position);
    index = nodes[index].next.find((n) => n >= 0);
  }
  return path;
}

export function parseInfo(text) {
  const info = {};
  for (const line of text.split(/\r?\n/)) {
    const tokens = line.split(";")[0].trim().split(/[\s,]+/);
    if (tokens.length > 1) info[tokens[0].toUpperCase()] = tokens.slice(1).map(Number);
  }
  return info;
}

export function parseAiPositions(buffer, origin = [0, 0, 0]) {
  if (buffer.byteLength <= 4) return [];
  const view = new DataView(buffer), count = view.getInt16(0, true);
  if (count <= 0 || buffer.byteLength !== 12 + count * 76) throw new Error("Invalid stock Re-Volt FAN file");
  const nodes = Array.from({ length: count }, (_, i) => {
    const offset = 12 + i * 76;
    const readVector = (at) => [0, 1, 2].map((axis) => view.getFloat32(at + axis * 4, true));
    const left = new THREE.Vector3(...converted(readVector(offset + 40), origin));
    const right = new THREE.Vector3(...converted(readVector(offset + 56), origin));
    return { position: left.lerp(right, THREE.MathUtils.clamp(view.getFloat32(offset + 4, true), 0, 1)), next: [view.getInt32(offset + 28, true), view.getInt32(offset + 32, true)] };
  });
  let start = 0;
  nodes.forEach((node, i) => { if (node.position.lengthSq() < nodes[start].position.lengthSq()) start = i; });
  const path = [], seen = new Set();
  let index = start;
  while (nodes[index] && !seen.has(index)) {
    seen.add(index); path.push(nodes[index].position);
    index = nodes[index].next.find((next) => next >= 0 && next < count);
  }
  return path;
}

function converted(position, origin = [0, 0, 0]) {
  return [(position[0] - origin[0]) * RV_SCALE, -(position[1] - origin[1]) * RV_SCALE, (position[2] - origin[2]) * RV_SCALE];
}

export function makeMeshes(meshes, materials, origin, animations = [], tint = [1, 1, 1]) {
  const buckets = new Map(), color = new THREE.Color();
  for (const source of meshes) for (const p of source.polygons) {
    const frame = p.flags & 0x200 ? animations[p.texture]?.[0] : null;
    const texture = frame?.texture ?? p.texture;
    const key = `${texture}:${p.flags & 0x106}`;
    if (!buckets.has(key)) buckets.set(key, { positions: [], colors: [], uv: [], flags: p.flags, texture });
    const b = buckets.get(key);
    // The Y reflection converts the original clockwise winding to Three.js winding.
    const corners = p.flags & 1 ? [0, 1, 2, 0, 2, 3] : [0, 1, 2];
    for (const c of corners) {
      const vertex = source.vertices[p.indices[c]];
      b.positions.push(...converted(vertex.position, origin));
      const rgba = p.colors[c];
      color.setRGB(rgba[0] / 255, rgba[1] / 255, rgba[2] / 255, THREE.SRGBColorSpace);
      b.colors.push(color.r * tint[0], color.g * tint[1], color.b * tint[2], p.flags & 4 ? rgba[3] / 255 : 1);
      const uv = frame?.uv[c] ?? p.uv[c];
      b.uv.push(uv[0], 1 - uv[1]);
    }
  }
  const group = new THREE.Group();
  for (const b of buckets.values()) {
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.Float32BufferAttribute(b.positions, 3));
    geometry.setAttribute("color", new THREE.Float32BufferAttribute(b.colors, 4));
    geometry.setAttribute("uv", new THREE.Float32BufferAttribute(b.uv, 2));
    geometry.computeVertexNormals();
    geometry.computeBoundingSphere();
    computeBoundsTree.call(geometry);
    const material = new THREE.MeshBasicMaterial({ map: materials[b.texture] ?? null, vertexColors: true, side: b.flags & 2 ? THREE.DoubleSide : THREE.FrontSide, transparent: Boolean(b.flags & 0x104), alphaTest: 0.01, depthWrite: !(b.flags & 0x104), blending: b.flags & 0x100 ? THREE.AdditiveBlending : THREE.NormalBlending });
    const object = new THREE.Mesh(geometry, material);
    object.raycast = acceleratedRaycast;
    group.add(object);
  }
  return group;
}

export function decodeBitmap(buffer) {
  const v = new DataView(buffer), offset = v.getUint32(10, true), dibSize = v.getUint32(14, true);
  const width = v.getInt32(18, true), signedHeight = v.getInt32(22, true), height = Math.abs(signedHeight);
  const bits = v.getUint16(28, true), compression = v.getUint32(30, true);
  if (![8, 24, 32].includes(bits) || compression !== 0) throw new Error(`Unsupported BMP: ${bits} bits, compression ${compression}`);
  const stride = Math.ceil(width * bits / 32) * 4, pixels = new Uint8Array(width * height * 4);
  for (let y = 0; y < height; y++) for (let x = 0; x < width; x++) {
    const row = signedHeight > 0 ? height - 1 - y : y;
    let source = offset + row * stride + x * (bits / 8);
    if (bits === 8) source = 14 + dibSize + v.getUint8(source) * 4;
    const dest = (y * width + x) * 4;
    pixels[dest] = v.getUint8(source + 2); pixels[dest + 1] = v.getUint8(source + 1); pixels[dest + 2] = v.getUint8(source);
    pixels[dest + 3] = pixels[dest] + pixels[dest + 1] + pixels[dest + 2] === 0 ? 0 : 255;
  }
  const texture = new THREE.DataTexture(pixels, width, height);
  texture.colorSpace = THREE.SRGBColorSpace; texture.flipY = true;
  texture.magFilter = THREE.LinearFilter; texture.minFilter = THREE.LinearMipmapLinearFilter;
  texture.generateMipmaps = true; texture.anisotropy = 8; texture.needsUpdate = true;
  return texture;
}

async function fetchBuffer(url) {
  const response = await fetch(gameAssetUrl(url));
  if (!response.ok) throw new Error(`Could not load ${url} (${response.status})`);
  return response.arrayBuffer();
}

export async function loadLevel(level, manifest, { collisions = true } = {}) {
  const base = `/levels/${level.id}/${level.id}`;
  const [worldBuffer, instanceBuffer, positionsBuffer, infoResponse, objectsBuffer, aiBuffer] = await Promise.all([fetchBuffer(`${base}.w`), fetchBuffer(`${base}.fin`), manifest.includes(`${base}.pan`) ? fetchBuffer(`${base}.pan`) : Promise.resolve(new ArrayBuffer(0)), fetch(gameAssetUrl(`${base}.inf`)), fetchBuffer(`${base}.fob`), fetchBuffer(`${base}.fan`)]);
  const world = parseWorld(worldBuffer), instances = parseInstances(instanceBuffer);
  const info = parseInfo(await infoResponse.text()), origin = info.STARTPOS ?? [0, 0, 0];
  const textures = {};
  const files = manifest.filter((p) => p.startsWith(`/levels/${level.id}/`));
  await Promise.all(files.filter((p) => p.match(new RegExp(`/${level.id}[a-z]\\.bmp$`, "i"))).map(async (p) => {
    const page = p.at(-5).toLowerCase().charCodeAt(0) - 97;
    textures[page] = decodeBitmap(await fetchBuffer(p));
  }));
  const group = makeMeshes(world.meshes, textures, origin, world.animations);
  const collisionGroup = new THREE.Group();
  collisionGroup.name = "Original track collision";
  collisionGroup.visible = false;
  if (collisions) {
    collisionGroup.add(collisionMesh(await fetchBuffer(`${base}.ncp`), origin));
    group.userData.collisionGroup = collisionGroup;
    group.add(collisionGroup);
  }
  const models = new Map();
  const resolved = instances.map((instance) => {
    const path = resolveModel(instance.name, files);
    if (!path) throw new Error(`Missing or ambiguous model ${level.id}/${instance.name}`);
    return { ...instance, path };
  });
  await Promise.all([...new Set(resolved.map((i) => i.path))].map(async (p) => models.set(p, parsePrm(await fetchBuffer(p)))));
  const collisionModels = new Map();
  if (collisions) await Promise.all([...new Set(resolved.filter(i => !(i.flags & (2 | 32))).map(i => i.path.replace(/\.prm$/i, ".ncp")))].filter(p => files.includes(p)).map(async p => collisionModels.set(p, await fetchBuffer(p))));
  for (const instance of resolved) {
    if (instance.flags & 2) continue;
    const model = makeMeshes([models.get(instance.path)], textures, [0, 0, 0], [], instance.flags & 16 ? instance.tint : [1, 1, 1]);
    const m = instance.matrix, position = converted(instance.position, origin);
    // FIN stores orientation basis vectors as rows (columns in Three.js).
    model.matrix.set(m[0], -m[3], m[6], position[0], -m[1], m[4], -m[7], position[1], m[2], -m[5], m[8], position[2], 0, 0, 0, 1);
    model.matrixAutoUpdate = false;
    model.name = instance.name;
    model.userData.noCollision = Boolean(instance.flags & 32);
    group.add(model);
    const collisionBuffer = collisionModels.get(instance.path.replace(/\.prm$/i, ".ncp"));
    if (!(instance.flags & 32) && collisionBuffer?.byteLength) {
      const solid = collisionMesh(collisionBuffer);
      solid.matrix.copy(model.matrix);
      solid.matrixAutoUpdate = false;
      solid.name = instance.name;
      collisionGroup.add(solid);
    }
  }
  const objects = parseObjects(objectsBuffer, origin);
  const water = objects.some(object => object.type === 68)
    ? new PoolWater(objects, parsePrm(await fetchBuffer("/models/poolwater.m"))) : null;
  if (water) group.add(water.group);
  group.updateMatrixWorld(true);
  let path = parsePositions(positionsBuffer).map((p) => new THREE.Vector3(...converted(p, origin)));
  if (path.length > 2) {
    let nearest = 0;
    path.forEach((p, i) => { if (p.lengthSq() < path[nearest].lengthSq()) nearest = i; });
    path = [...path.slice(nearest), ...path.slice(0, nearest)];
  }
  return { group, path, aiPath: parseAiPositions(aiBuffer, origin), info, textures, objects, water, stats: { meshes: world.meshes.length, polygons: world.meshes.reduce((n, m) => n + m.polygons.length, 0), instances: instances.length, textures: Object.keys(textures).length } };
}

export function disposeLevel(level) {
  if (!level) return;
  level.group.traverse((o) => { o.geometry?.dispose(); o.material?.dispose(); });
  Object.values(level.textures).forEach((t) => t.dispose());
}

export async function loadCar(id, name) {
  const base = `/cars/${id}`;
  const response = await fetch(gameAssetUrl(`${base}/parameters.txt`));
  const parameters = (await response.text()).replace(/;[^\r\n]*/g, "");
  const models = new Map([...parameters.matchAll(/MODEL\s+(\d+)\s+"([^"]+)"/gi)].map((m) => [Number(m[1]), `/${m[2].replaceAll("\\", "/").toLowerCase()}`]));
  const tpage = parameters.match(/TPAGE\s+"([^"]+)"/i)[1];
  const texture = decodeBitmap(await fetchBuffer(`/${tpage.replaceAll("\\", "/").toLowerCase()}`));
  const textures = Object.fromEntries(Array.from({ length: 32 }, (_, i) => [i, texture]));
  const root = new THREE.Group();
  root.name = name;
  root.userData.engineClass = Number(parameters.match(/^\s*Class\s+(\d+)/im)?.[1] ?? 0);
  const body = parameters.match(/BODY\s*\{([^}]+)\}/i)[1];
  const bodyNumber = Number(body.match(/ModelNum\s+(\d+)/i)[1]);
  const bodyMesh = makeMeshes([parsePrm(await fetchBuffer(models.get(bodyNumber)))], textures, [0, 0, 0]);
  root.add(bodyMesh);
  const bodyBounds = new THREE.Box3().setFromObject(root);
  const wheels = [];
  for (const block of parameters.matchAll(/WHEEL\s+\d+\s*\{([^}]+)\}/gi)) {
    const number = Number(block[1].match(/ModelNum\s+(\d+)/i)[1]);
    const offset = block[1].match(/Offset1\s+([^\r\n]+)/i)[1].trim().split(/[\s,]+/).map(Number);
    const tire = makeMeshes([parsePrm(await fetchBuffer(models.get(number)))], textures, [0, 0, 0]);
    const wheel = new THREE.Group();
    wheel.add(tire);
    wheel.userData.tire = tire;
    wheel.userData.turnable = /IsTurnable\s+TRUE/i.test(block[1]);
    wheel.userData.powered = /IsPowered\s+TRUE/i.test(block[1]);
    wheel.userData.engineRatio = Math.abs(Number(block[1].match(/EngineRatio\s+([-\d.]+)/i)?.[1] ?? 1));
    wheel.userData.steerRatio = Math.abs(Number(block[1].match(/SteerRatio\s+([-\d.]+)/i)?.[1] ?? 0.45));
    wheel.position.set(...converted(offset));
    root.add(wheel); wheels.push(wheel);
  }
  const bounds = new THREE.Box3().setFromObject(root);
  const visual = new THREE.Group();
  [...root.children].forEach((child) => visual.add(child));
  visual.position.y = -bounds.min.y - 0.42;
  root.add(visual);
  const bodyVertices = [];
  const vertex = new THREE.Vector3();
  bodyMesh.traverse((object) => {
    if (!object.geometry) return;
    const positions = object.geometry.attributes.position;
    for (let i = 0; i < positions.count; i++) bodyVertices.push(...vertex.fromBufferAttribute(positions, i).add(visual.position).toArray());
  });
  root.userData.wheels = wheels;
  root.userData.physics = {
    bodyVertices: new Float32Array(bodyVertices),
    halfExtents: bodyBounds.getSize(new THREE.Vector3()).multiplyScalar(0.5),
    center: bodyBounds.getCenter(new THREE.Vector3()).add(visual.position),
    wheels: wheels.map((wheel) => {
      const size = new THREE.Box3().setFromObject(wheel).getSize(new THREE.Vector3());
      return { position: wheel.position.clone().add(visual.position), radius: size.y * 0.5, halfWidth: size.x * 0.5, turnable: wheel.userData.turnable, powered: wheel.userData.powered, steerRatio: wheel.userData.steerRatio, engineRatio: wheel.userData.engineRatio };
    }),
  };
  const aerial = parameters.match(/AERIAL\s*\{([^}]+)\}/i)?.[1] ?? "";
  const values = (name, fallback) => aerial.split(/\r?\n/).map(line => line.trim().split(/[\s,]+/)).find(fields => fields[0].toLowerCase() === name.toLowerCase())?.slice(1).map(Number) ?? fallback;
  const offset = new THREE.Vector3(...converted(values("Offset", [0, -bodyBounds.max.y / RV_SCALE, -bodyBounds.max.z / RV_SCALE * 0.5]))).add(visual.position);
  const direction = new THREE.Vector3(...converted(values("Direction", [0, -1, 0]))).normalize();
  if (direction.lengthSq() === 0) direction.set(0, 1, 0);
  root.userData.antenna = new FlexibleAntenna(root, {
    offset, direction,
    length: Math.max(1.2, (values("Length", [20])[0] || 20) * RV_SCALE),
    stiffness: values("Stiffness", [2000])[0],
    damping: values("Damping", [5.5])[0],
  });
  return root;
}

    <script type="text/plain" data-game-module="showroom.js">
import * as THREE from "three";
import { gameAssetUrl } from "./assets.js";
import { loadLevel, loadCar, parsePrm, makeMeshes } from "./revolt.js";
import { FRONTEND } from "./levels.js";

export const STOCK_CARS = ["rc", "tc6", "phat", "volken", "beatall", "mouse", "candy", "mite", "r5", "tc1", "mud", "moss", "gencar", "tc5", "tc4", "dino", "adeon", "tc3", "fone", "rotor", "amw", "flag", "sgt", "tc2", "cougar", "toyeca", "sugo", "panga"];


// The shop corner between SALEBIN (265, -181) and MAGSTAND (233, -85).
// Coordinates use the same converted world units as the original frontend.
export const CAR_DISPLAY = { center: [242, 0, -134], radius: 32, columns: 7, rows: 4, scale: 0.7 };

export function boxShelfPose(index) {
  const column = index % CAR_DISPLAY.columns;
  const row = Math.floor(index / CAR_DISPLAY.columns);
  const angle = -1.15 + column * 2.3 / (CAR_DISPLAY.columns - 1);
  return {
    position: [CAR_DISPLAY.center[0] + Math.cos(angle) * CAR_DISPLAY.radius,
      4.82 + row * 10.2, CAR_DISPLAY.center[2] + Math.sin(angle) * CAR_DISPLAY.radius],
    rotation: -Math.PI / 2 - angle,
  };
}

function addBoxShelves(scene) {
  const wood = new THREE.MeshBasicMaterial({ color: 0x80602d });
  // Short boards follow the curve instead of cutting across the shop corner.
  for (let row = 0; row < CAR_DISPLAY.rows; row++) {
    for (let column = 0; column < CAR_DISPLAY.columns - 1; column++) {
      const a = new THREE.Vector3(...boxShelfPose(row * CAR_DISPLAY.columns + column).position);
      const b = new THREE.Vector3(...boxShelfPose(row * CAR_DISPLAY.columns + column + 1).position);
      const board = new THREE.Mesh(new THREE.BoxGeometry(9, 0.6, a.distanceTo(b) + 2), wood);
      board.position.copy(a).add(b).multiplyScalar(0.5);
      board.position.x += 3;
      board.position.y -= 4.9;
      board.rotation.y = Math.atan2(b.x - a.x, b.z - a.z);
      scene.add(board);
    }
  }
}

export function carDetails(text, id) {
  const clean = text.replace(/;[^\r\n]*/g, "");
  const number = (key) => Number(clean.match(new RegExp(`^\\s*${key}\\s+([-\\d.]+)`, "im"))?.[1] ?? 0);
  return { id, name: clean.match(/Name\s+"([^"]+)"/i)?.[1] ?? id,
    engineClass: number("Class"), rating: number("Rating"), speed: number("TopSpeed"),
    acceleration: number("Acc"), weight: number("Weight"), transmission: number("Trans") };
}

// Keep the original box geometry and atlas UVs; only its front label is car-specific.
export function labeledBox(source) {
  const model = structuredClone(source);
  model.polygons.forEach((polygon, i) => {
    polygon.colors = polygon.colors.map(() => [255, 255, 255, 255]);
    if (i === 0) {
      polygon.texture = 7;
      polygon.uv = [[0, 0], [0, 1], [1, 1], [1, 0]];
    }
  });
  return model;
}

function boxLabel(renderer, car, details, atlas) {
  const canvas = document.createElement("canvas");
  canvas.width = 512; canvas.height = 416;
  const ctx = canvas.getContext("2d");
  const image = atlas.image;
  const original = document.createElement("canvas");
  original.width = image.width; original.height = image.height;
  original.getContext("2d").putImageData(new ImageData(new Uint8ClampedArray(image.data), image.width, image.height), 0, 0);
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, 512, 416);
  ctx.drawImage(original, 0, 86, 132, 110, 0, 0, 512, 416);
  ctx.fillStyle = "#ffffff"; ctx.fillRect(145, 64, 365, 336);
  ctx.fillStyle = "#d32132"; ctx.font = "bold 30px Arial";
  ctx.fillText(details.name.toUpperCase(), 153, 100, 348);

  const preview = new THREE.Scene();
  preview.add(car);
  const bounds = new THREE.Box3().setFromObject(car);
  const center = bounds.getCenter(new THREE.Vector3());
  const size = bounds.getSize(new THREE.Vector3()).length();
  const camera = new THREE.PerspectiveCamera(38, 1.4, 0.1, 200);
  camera.position.copy(center).add(new THREE.Vector3(size * 0.8, size * 0.65, size * 0.9));
  camera.lookAt(center);
  const target = new THREE.WebGLRenderTarget(350, 250);
  const oldTarget = renderer.getRenderTarget(), oldColor = renderer.getClearColor(new THREE.Color()), oldAlpha = renderer.getClearAlpha();
  renderer.setRenderTarget(target); renderer.setClearColor(0xffffff, 0);
  renderer.render(preview, camera);
  const pixels = new Uint8Array(350 * 250 * 4);
  renderer.readRenderTargetPixels(target, 0, 0, 350, 250, pixels);
  renderer.setRenderTarget(oldTarget); renderer.setClearColor(oldColor, oldAlpha);
  const flipped = new Uint8ClampedArray(pixels.length);
  for (let y = 0; y < 250; y++) flipped.set(pixels.subarray(y * 1400, (y + 1) * 1400), (249 - y) * 1400);
  const rendered = document.createElement("canvas"); rendered.width = 350; rendered.height = 250;
  rendered.getContext("2d").putImageData(new ImageData(flipped, 350, 250), 0, 0);
  ctx.drawImage(rendered, 155, 122);
  target.dispose();
  preview.remove(car);
  car.traverse((o) => { o.geometry?.dispose(); if (o.material) { o.material.map?.dispose(); o.material.dispose(); } });
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = 8;
  return texture;
}

export class Showroom {
  static async create(renderer, manifest) {
    const showroom = new Showroom();
    const loaded = await loadLevel(FRONTEND, manifest, { collisions: false });
    showroom.scene.add(loaded.group);
    const response = await fetch(gameAssetUrl("/levels/frontend/carbox.m"));
    const model = labeledBox(parsePrm(await response.arrayBuffer()));
    showroom.cars = await Promise.all(STOCK_CARS.map(async (id) => carDetails(await (await fetch(gameAssetUrl(`/cars/${id}/parameters.txt`))).text(), id)));
    // Four curved shelves in the original shop corner shown in the reference.
    addBoxShelves(showroom.scene);
    const previews = await Promise.all(showroom.cars.map(details => loadCar(details.id, details.name)));
    for (const [index, details] of showroom.cars.entries()) {
      const car = previews[index];
      const label = boxLabel(renderer, car, details, loaded.textures[4]);
      const box = makeMeshes([model], { ...loaded.textures, 7: label }, [0, 0, 0]);
      const pose = boxShelfPose(index);
      box.scale.setScalar(CAR_DISPLAY.scale);
      box.position.set(...pose.position);
      box.rotation.y = pose.rotation;
      box.userData.homeRotation = pose.rotation;
      box.userData.home = box.position.clone(); box.userData.carIndex = index;
      showroom.boxes.push(box); showroom.scene.add(box);
    }
    showroom.select(0);
    return showroom;
  }

  constructor() {
    this.scene = new THREE.Scene(); this.scene.background = new THREE.Color(0x111111);
    this.camera = new THREE.PerspectiveCamera(52, 1, 0.1, 800);
    this.boxes = []; this.selected = 0; this.ray = new THREE.Raycaster();
  }

  select(index) {
    this.selected = (index + this.boxes.length) % this.boxes.length;
    return this.cars[this.selected];
  }

  pick(x, y) {
    this.ray.setFromCamera(new THREE.Vector2(x, y), this.camera);
    const hit = this.ray.intersectObjects(this.boxes, true)[0];
    if (!hit) return null;
    let box = hit.object;
    while (box && box.userData.carIndex === undefined) box = box.parent;
    return box ? this.select(box.userData.carIndex) : null;
  }

  render(renderer, dt, aspect) {
    this.camera.aspect = aspect; this.camera.updateProjectionMatrix();
    // Face the sale-display / magazine-rack corner, rather than the central aisle.
    const portrait = aspect < 1;
    this.camera.position.set(portrait ? 118 : 145, portrait ? 82 : 76, -134);
    this.camera.lookAt(256, portrait ? 35 : 28, -134);
    for (const [i, box] of this.boxes.entries()) {
      const target = i === this.selected ? new THREE.Vector3(225, portrait ? 49 : 42, portrait ? -134 : -112) : box.userData.home;
      box.position.lerp(target, 1 - Math.exp(-dt * 9));
      const blend = 1 - Math.exp(-dt * 9);
      const scale = i === this.selected ? 1.5 : CAR_DISPLAY.scale;
      box.scale.lerp(new THREE.Vector3(scale, scale, scale), blend);
      const rotation = i === this.selected ? -Math.PI / 2 + 0.12 : box.userData.homeRotation;
      box.rotation.y += (rotation - box.rotation.y) * blend;
    }
    renderer.render(this.scene, this.camera);
  }
}

import * as THREE from "three";

export function isSkidding({ speed, lateralSpeed, steer, handbrake, airborne }) {
  return !airborne && Math.abs(speed) > 8 && (Math.abs(lateralSpeed) > 3 || (handbrake && Math.abs(steer) > 0.25));
}

export class SkidMarks {
  constructor(scene, capacity = 2048) {
    this.scene = scene; this.capacity = capacity; this.count = 0; this.next = 0;
    this.previous = new Map(); this.ages = new Float32Array(capacity).fill(40);
    this.positions = new Float32Array(capacity * 18);
    this.colors = new Float32Array(capacity * 24);
    this.geometry = new THREE.BufferGeometry();
    this.geometry.setAttribute("position", new THREE.BufferAttribute(this.positions, 3).setUsage(THREE.DynamicDrawUsage));
    this.geometry.setAttribute("color", new THREE.BufferAttribute(this.colors, 4).setUsage(THREE.DynamicDrawUsage));
    this.geometry.setDrawRange(0, 0);
    this.material = new THREE.MeshBasicMaterial({ color: 0x141414, vertexColors: true, transparent: true, depthWrite: false, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 });
    this.mesh = new THREE.Mesh(this.geometry, this.material);
    this.mesh.name = "Tire skid marks"; this.mesh.frustumCulled = false;
    scene.add(this.mesh);
  }

  segment(from, to, normal, width) {
    const direction = to.clone().sub(from);
    const distance = direction.length();
    if (distance < 0.15 || distance > 8) return false;
    const side = new THREE.Vector3().crossVectors(normal, direction).normalize().multiplyScalar(width / 2);
    const lift = normal.clone().multiplyScalar(0.025);
    const corners = [from.clone().add(side).add(lift), from.clone().sub(side).add(lift), to.clone().sub(side).add(lift), to.clone().add(side).add(lift)];
    const slot = this.next; this.next = (slot + 1) % this.capacity;
    [0,1,2,0,2,3].forEach((corner, i) => {
      corners[corner].toArray(this.positions, slot * 18 + i * 3);
      this.colors.set([1,1,1,0.6], slot * 24 + i * 4);
    });
    this.ages[slot] = 0; this.count = Math.min(this.capacity, this.count + 1);
    this.geometry.setDrawRange(0, this.count * 6);
    this.geometry.attributes.position.needsUpdate = true; this.geometry.attributes.color.needsUpdate = true;
    return true;
  }

  track(racer) {
    if (!racer.sliding || racer.finished) { this.previous.delete(racer); return; }
    const previous = this.previous.get(racer) ?? [];
    const vehicle = racer.car.vehicle;
    for (let i = 0; i < vehicle.numWheels(); i++) {
      const contact = vehicle.wheelIsInContact(i) && vehicle.wheelContactPoint(i);
      const contactNormal = vehicle.wheelContactNormal(i);
      if (!contact || !contactNormal || contactNormal.y < 0.15) { previous[i] = null; continue; }
      const point = new THREE.Vector3().copy(contact), normal = new THREE.Vector3().copy(contactNormal).normalize();
      if (!previous[i]) previous[i] = point;
      else if (point.distanceTo(previous[i]) > 8) previous[i] = point;
      else if (this.segment(previous[i], point, normal, Math.max(0.25, racer.car.setup.wheels[i].radius * 0.45))) previous[i] = point;
    }
    this.previous.set(racer, previous);
  }

  update(dt) {
    for (let slot = 0; slot < this.count; slot++) {
      this.ages[slot] += dt;
      const alpha = 0.6 * THREE.MathUtils.clamp((40 - this.ages[slot]) / 20, 0, 1);
      for (let i = 0; i < 6; i++) this.colors[slot * 24 + i * 4 + 3] = alpha;
    }
    this.geometry.attributes.color.needsUpdate = true;
  }

  clear() { this.count = 0; this.next = 0; this.previous.clear(); this.geometry.setDrawRange(0, 0); this.ages.fill(40); }
  dispose() { this.scene.remove(this.mesh); this.geometry.dispose(); this.material.dispose(); this.previous.clear(); }
}

    <script type="text/plain" data-game-module="touch-controls.js">
export function bindTouchButton(button, code, pointers, enabled) {
  function release(event) {
    pointers.delete(event.pointerId);
    button.classList.toggle("is-pressed", [...pointers.values()].includes(code));
  }
  button.addEventListener("pointerdown", (event) => {
    if (!enabled() || (event.pointerType === "mouse" && event.button !== 0)) return;
    event.preventDefault();
    button.setPointerCapture(event.pointerId);
    pointers.set(event.pointerId, code);
    button.classList.add("is-pressed");
  });
  for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) button.addEventListener(type, release);
  button.addEventListener("contextmenu", (event) => event.preventDefault());
}

export function createTouchControls({ enabled, onFire = () => {} }) {
  const controls = document.createElement("div");
  controls.className = "touch-controls hud";
  controls.setAttribute("role", "group");
  controls.setAttribute("aria-label", "Touch driving controls");
  const pointers = new Map();
  const groups = [
    [["KeyA", "◀", "Steer left"], ["KeyD", "▶", "Steer right"]],
    [["KeyS", "Brake", "Brake or reverse"], ["KeyW", "Gas", "Accelerate"]],
  ];
  for (const actions of groups) {
    const group = document.createElement("div");
    group.className = "touch-control-group";
    for (const [code, label, name] of actions) {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = label;
      button.setAttribute("aria-label", name);
      button.dataset.code = code;
      group.append(button);
      bindTouchButton(button, code, pointers, enabled);
    }
    controls.append(group);
  }
  const pedals = controls.lastElementChild;
  pedals.classList.add("touch-pedals");
  const fireButton = document.createElement("button");
  fireButton.type = "button";
  fireButton.className = "touch-fire";
  fireButton.textContent = "Fire";
  fireButton.setAttribute("aria-label", "Fire power-up");
  fireButton.disabled = true;
  pedals.prepend(fireButton);
  fireButton.addEventListener("pointerdown", (event) => {
    if (!enabled() || fireButton.disabled || (event.pointerType === "mouse" && event.button !== 0)) return;
    event.preventDefault();
    fireButton.setPointerCapture(event.pointerId);
    fireButton.classList.add("is-pressed");
    onFire();
  });
  for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) {
    fireButton.addEventListener(type, () => fireButton.classList.remove("is-pressed"));
  }
  fireButton.addEventListener("contextmenu", (event) => event.preventDefault());
  document.querySelector("#game").append(controls);
  function clear() {
    pointers.clear();
    for (const button of controls.querySelectorAll("button")) button.classList.remove("is-pressed");
  }
  window.addEventListener("blur", clear);
  document.addEventListener("visibilitychange", () => { if (document.hidden) clear(); });
  return { pressed: (code) => [...pointers.values()].includes(code), clear,
    setFireEnabled: (available) => { fireButton.disabled = !available; } };
}

    </script>
    <script type="module">
      // Build browser module URLs from the readable game code embedded above.
      // No npm install, bundler, or compilation is required.
      const sources = new Map([...document.querySelectorAll("[data-game-module]")].map(
        (element) => [element.dataset.gameModule, element.textContent]
      ));
      const urls = new Map();
      const visiting = new Set();
      function moduleUrl(name) {
        if (urls.has(name)) return urls.get(name);
        if (visiting.has(name)) throw new Error("Circular game module: " + name);
        if (!sources.has(name)) throw new Error("Missing game module: " + name);
        visiting.add(name);
        const source = sources.get(name).replace(
          /\bfrom\s+(["'])\.\/([^"']+)\1/g,
          (match, quote, dependency) => "from " + JSON.stringify(moduleUrl(dependency))
        );
        const url = URL.createObjectURL(new Blob([source], { type: "text/javascript" }));
        urls.set(name, url);
        visiting.delete(name);
        return url;
      }
      try {
        await import(moduleUrl("main.js"));
      } catch (error) {
        console.error(error);
        document.querySelector("#startDescription").textContent = "Could not start game: " + error.message;
        document.querySelector("#startBtn").disabled = true;
      }
    </script>
  </body>
