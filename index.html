    <style>
:root {
  color-scheme: dark;
  font-family:
    Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
    sans-serif;
  background: #080a0d;
  color: #f5f7fb;
}

* {
  box-sizing: border-box;
}

html,
body,
#game {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  min-width: 320px;
}

#scene {
  display: block;
  width: 100%;
  height: 100%;
  background: #0b1017;
}

button,
select {
  appearance: none;
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 8px;
  background: rgba(14, 18, 24, 0.72);
  color: #fff;
  cursor: pointer;
  font: inherit;
  font-weight: 800;
  min-height: 42px;
  padding: 0 14px;
  backdrop-filter: blur(14px);
}

button:hover,
button:focus-visible,
select:hover,
select:focus-visible {
  background: rgba(255, 255, 255, 0.16);
  outline: none;
}

select {
  max-width: min(34vw, 210px);
  padding-right: 28px;
  background: #171a1f;
  color: #ffffff;
  color-scheme: dark;
}

select option {
  background: #171a1f;
  color: #ffffff;
  font-weight: 600;
}

select:hover,
select:focus-visible {
  background: #292d34;
  color: #ffffff;
  outline: 2px solid #f1c94b;
  outline-offset: 2px;
}

.hud {
  position: fixed;
  z-index: 5;
  pointer-events: none;
}

.hud-top {
  top: 18px;
  left: 18px;
  right: 18px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
}

.brand,
.readouts,
.help,
.minimap,
.hud-left {
  border: 1px solid rgba(255, 255, 255, 0.14);
  background: rgba(8, 10, 13, 0.58);
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.24);
  backdrop-filter: blur(16px);
}

.brand {
  border-radius: 8px;
  padding: 12px 14px;
}

.brand strong {
  display: block;
  font-size: clamp(1rem, 2vw, 1.45rem);
  line-height: 1.1;
  white-space: nowrap;
}

.kicker {
  color: #9ad0ff;
  display: block;
  font-size: 0.72rem;
  font-weight: 900;
  letter-spacing: 0;
  text-transform: uppercase;
}

.readouts {
  display: grid;
  grid-template-columns: repeat(4, minmax(58px, 86px));
  border-radius: 8px;
  overflow: hidden;
}

.readouts div {
  min-height: 58px;
  padding: 8px 10px;
  border-left: 1px solid rgba(255, 255, 255, 0.1);
}

.readouts div:first-child {
  border-left: 0;
}

.readouts span {
  color: #b5c1d0;
  display: block;
  font-size: 0.7rem;
  font-weight: 800;
}

.readouts strong {
  display: block;
  font-size: 1.25rem;
  line-height: 1.3;
  white-space: nowrap;
}

.hud-left {
  left: 18px;
  bottom: 18px;
  display: flex;
  gap: 8px;
  border-radius: 8px;
  padding: 8px;
  pointer-events: auto;
}

.minimap {
  right: 18px;
  bottom: 18px;
  width: 180px;
  height: 180px;
  border-radius: 8px;
  overflow: hidden;
}

#map {
  display: block;
  width: 100%;
  height: 100%;
}

.help {
  position: fixed;
  left: 50%;
  bottom: 24px;
  z-index: 4;
  display: flex;
  transform: translateX(-50%);
  gap: 10px;
  border-radius: 8px;
  padding: 9px 12px;
  color: #d7deea;
  font-size: 0.78rem;
  font-weight: 800;
  pointer-events: none;
}

.start {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  padding: 28px 4%;
  pointer-events: none;
}

.start-panel {
  width: 320px;
  max-width: 100%;
  pointer-events: auto;
  padding: 18px;
  background: rgba(0, 0, 0, 0.68);
  border-left: 3px solid #f1c94b;
}

.start h1 {
  margin: 8px 0 12px;
  font-size: 42px;
  line-height: 1;
  letter-spacing: 0;
}

.start p {
  max-width: 52ch;
  color: #edf4ff;
  font-size: 14px;
  line-height: 1.55;
  text-shadow: 0 2px 14px rgba(0, 0, 0, 0.55);
}

#startBtn {
  min-width: 150px;
  margin-top: 10px;
  background: #f1c94b;
  border-color: #ffe48a;
  color: #101010;
}

.start.hidden {
  opacity: 0;
  pointer-events: none;
  transition: opacity 400ms ease;
}
.start.hidden .start-panel { pointer-events: none; }
.menu-open .hud, .menu-open .help { visibility: hidden; }
.powerup-slot { top: 110px; left: 18px; width: 246px; min-height: 74px; display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,0.68); border-left: 3px solid #f1c94b; padding: 5px; }
.powerup-slot button { pointer-events: auto; width: 64px; height: 64px; min-width: 64px; padding: 0; border-radius: 4px; }
.powerup-slot button:disabled { cursor: default; opacity: 0.6; }
.powerup-slot canvas { display: block; width: 60px; height: 60px; }
.powerup-slot strong { font-size: 14px; display: block; }
.powerup-slot span { display: block; color: #f1c94b; font-size: 12px; min-height: 16px; margin-top: 5px; }
@media (max-width: 760px) { .powerup-slot { top: 160px; width: min(220px, calc(100% - 154px)); } }
.powerup-slot > div { min-width: 0; overflow-wrap: anywhere; }
.debug-panel { top: 110px; right: 18px; width: 240px; padding: 12px; background: #171a1f; border: 1px solid #f1c94b; border-radius: 4px; pointer-events: auto; }
.debug-panel h2 { margin: 0 0 12px; font-size: 16px; display: flex; justify-content: space-between; align-items: center; }
.debug-panel h2 span { font-size: 11px; font-weight: 500; color: #f1c94b; }
.debug-panel label { display: block; font-size: 12px; margin-bottom: 6px; }
.debug-panel select { width: 100%; max-width: none; font-size: 13px; }
.debug-actions { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 6px; margin-top: 8px; }
.debug-actions button { padding: 0 6px; font-size: 13px; border-radius: 4px; }

.start h2 { font-size: 20px; text-transform: uppercase; color: #f1c94b; margin: 24px 0 12px; }
.start h3 { font-size: 20px; color: #f1c94b; margin: 20px 0 14px; }
.car-selector { display: grid; grid-template-columns: 36px minmax(0, 1fr) 36px; gap: 5px; }
.car-selector button { padding: 0; border-radius: 4px; }
.car-selector select { width: 100%; max-width: none; padding: 0 8px; font-size: 14px; }
#carStats { display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 9px 6px; font-size: 13px; }

.track-label { display: block; font-size: 13px; margin: 20px 0 6px; }

@media (max-width: 600px) {
  .start { align-items: flex-end; padding: 12px; }

  .start h1 { font-size: 26px; margin: 0; }
  .start h2 { font-size: 16px; margin: 8px 0; }

@media (max-width: 760px) {

    align-items: stretch;
    flex-direction: column;

    white-space: normal;

    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .readouts div {
    min-height: 50px;
    padding: 7px;
  }

  .readouts strong {
    font-size: 1rem;

  .help {
    display: none;

  .minimap {
    top: 160px;

    height: 100px;

    justify-content: center;

    max-width: 100%;
  }
}

.touch-controls { display: none; }
@media (any-pointer: coarse), (max-width: 1024px) {
  #scene { touch-action: none; }
  .touch-controls {
    display: flex; justify-content: space-between; align-items: flex-end;
    left: max(12px, env(safe-area-inset-left)); right: max(12px, env(safe-area-inset-right));
    bottom: max(12px, env(safe-area-inset-bottom)); gap: 12px;
  }
  .touch-control-group { display: flex; gap: 8px; pointer-events: auto; }
  .touch-controls button {
    width: clamp(48px, 11vw, 72px); height: clamp(60px, 14vw, 80px);
    padding: 0; font-size: 14px; touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    background: rgba(14, 18, 24, 0.8); border: 2px solid rgba(255,255,255,0.45);
  }
  .touch-controls button[data-code="KeyW"] { background: rgba(52, 120, 55, 0.85); }
  .touch-controls button.is-pressed { background: #f1c94b; color: #101010; border-color: #fff; }
  .touch-pedals { display: grid; grid-template-columns: repeat(2, auto); }
  .touch-controls .touch-fire {
    grid-column: 1 / -1; width: 100%; height: 48px;
    background: #b3312c; border-color: #ef746d; font-size: 16px;
  }
  .touch-controls .touch-fire:disabled { opacity: 0.55; }
  .hud-top { top: max(8px, env(safe-area-inset-top)); left: 12px; right: 12px; flex-direction: row; }
  .brand, .help, .debug-panel { display: none; }
  .readouts { width: 100%; grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .readouts div { min-height: 42px; padding: 4px 8px; }
  .readouts strong { font-size: 1rem; }
  .hud-left {
    left: 12px; right: 12px; top: calc(max(8px, env(safe-area-inset-top)) + 48px);
    bottom: auto; padding: 4px; gap: 6px; justify-content: flex-end; flex-wrap: wrap;
    background: transparent; border: 0; box-shadow: none; backdrop-filter: none;
    pointer-events: none;
  }
  .hud-left button { pointer-events: auto; padding: 0 10px; min-height: 44px; font-size: 12px; }
  .hud-left #levelSelect, .hud-left #nextLevelBtn { display: none; }
  .powerup-slot {
    top: calc(max(8px, env(safe-area-inset-top)) + 102px);
    left: 12px; width: min(220px, calc(100% - 130px)); min-height: 64px;
  }
  .powerup-slot button { touch-action: manipulation; }
  .minimap {
    top: calc(max(8px, env(safe-area-inset-top)) + 102px);
    right: 12px; bottom: auto; width: 88px; height: 88px;
  }
  .start { overflow-y: auto; pointer-events: auto; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  .start-panel { margin: auto 0; }
}
@media (any-pointer: coarse) and (max-height: 500px), (max-width: 1024px) and (max-height: 500px) {
  .start { align-items: flex-start; padding-top: 8px; }
  .start-panel { width: 300px; padding: 10px; }
  .start h1 { font-size: 24px; margin: 0; }
  .start h2 { font-size: 16px; margin: 6px 0; }
  .start h3, #carStats { display: none; }
  .track-label { margin-top: 8px; }
  .minimap { width: 64px; height: 64px; }
}

export function gameAssetUrl(path, base = new URL(".", document.baseURI).pathname) {
  if (/^(?:[a-z]+:)?\/\//i.test(path) || /^(data|blob):/i.test(path)) return path;
  return `${base.endsWith("/") ? base : `${base}/`}${path.replace(/^\/+/, "")}`;
}

    <script type="text/plain" data-game-module="car-effects.js">
import * as THREE from "three";

export function setWheelPose(wheel, steering, rotation) {
  wheel.rotation.set(0, steering, 0);
  wheel.userData.tire.rotation.set(rotation, 0, 0);
}

export class CarResetFade {
  constructor(mesh) {
    this.mesh = mesh; this.materials = new Map(); this.active = false;
    this.opacity = 1; this.elapsed = 0; this.repositioned = false;
  }

  start(reposition) {
    if (this.active) return false;
    this.active = true; this.elapsed = 0; this.repositioned = false; this.reposition = reposition;
    this.apply(1);
    return true;
  }

  apply(opacity) {
    this.opacity = opacity;
    this.mesh.traverse((object) => {
      if (!object.material) return;
      for (const material of Array.isArray(object.material) ? object.material : [object.material]) {
        if (!this.materials.has(material)) this.materials.set(material, { opacity: material.opacity, transparent: material.transparent, depthWrite: material.depthWrite });
        const original = this.materials.get(material);
        if (!material.transparent) { material.transparent = true; material.needsUpdate = true; }
        material.opacity = original.opacity * opacity;
        material.depthWrite = false;
      }
    });
  }

  update(dt) {
    if (!this.active) return;
    this.elapsed += Math.max(0, dt);
    const fadeOut = 0.25, fadeIn = 0.4;
    if (this.elapsed < fadeOut) this.apply(1 - this.elapsed / fadeOut);
    else {
      if (!this.repositioned) { this.apply(0); this.repositioned = true; this.reposition(); }
      if (this.elapsed < fadeOut + fadeIn) this.apply((this.elapsed - fadeOut) / fadeIn);
      else this.cancel();
    }
  }

  cancel() {
    for (const [material, original] of this.materials) {
      if (material.transparent !== original.transparent) material.needsUpdate = true;
      material.opacity = original.opacity; material.transparent = original.transparent; material.depthWrite = original.depthWrite;
    }
    this.materials.clear(); this.active = false; this.opacity = 1; this.reposition = null;
  }
}

export function engineProfile(engineClass) {
  return engineClass === 1
    ? { sample: "/wavs/petrol.wav", idleVolume: 0.12, idlePitch: 0.7, revRange: 1.4 }
    : { sample: "/wavs/electro.wav", idleVolume: 0.025, idlePitch: 0.65, revRange: 1.7 };
}

export class CarEngineAudio {
  constructor(listener, mesh, buffer) {
    this.profile = engineProfile(mesh.userData.engineClass);
    this.audio = new THREE.PositionalAudio(listener);
    this.audio.setBuffer(buffer).setLoop(true).setRefDistance(18).setRolloffFactor(1.5).setMaxDistance(160);
    this.audio.setVolume(0);
    mesh.add(this.audio);
    this.revs = 0;
  }

  update(dt, { running, muted, speed, throttle, airborne }) {
    if (!running || muted) {
      if (this.audio.isPlaying) this.audio.stop();
      return;
    }
    if (!this.audio.isPlaying) this.audio.play();
    const load = Math.abs(throttle);
    const target = THREE.MathUtils.clamp(Math.abs(speed) / 45 * 0.8 + load * (airborne ? 0.8 : 0.25), 0, 1);
    this.revs = THREE.MathUtils.lerp(this.revs, target, 1 - Math.exp(-dt * 8));
    this.audio.setPlaybackRate(this.profile.idlePitch + this.revs * this.profile.revRange);
    this.audio.setVolume(this.profile.idleVolume + this.revs * 0.22 + load * 0.07);
  }
}

export class FlexibleAntenna {
  constructor(car, { offset, direction, length, stiffness = 2000, damping = 5.5 }) {
    this.car = car;
    this.offset = offset.clone();
    this.direction = direction.clone().normalize();
    this.length = length;
    this.count = 8;
    this.segmentLength = length / this.count;
    this.stiffness = THREE.MathUtils.clamp(stiffness * 0.04, 45, 180);
    this.damping = THREE.MathUtils.clamp(damping, 4, 12);
    this.points = Array.from({ length: this.count + 1 }, () => new THREE.Vector3());
    this.velocities = this.points.map(() => new THREE.Vector3());
    this.lastAnchor = new THREE.Vector3();
    this.initialized = false;
    this.group = new THREE.Group();
    this.group.name = "Flexible antenna";
    const material = new THREE.MeshBasicMaterial({ color: 0x17191c });
    const radius = Math.max(0.025, length * 0.015);
    this.rods = Array.from({ length: this.count }, () => {
      const rod = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, this.segmentLength, 5), material);
      this.group.add(rod);
      return rod;
    });
    this.tip = new THREE.Mesh(new THREE.SphereGeometry(radius * 2.3, 8, 6), new THREE.MeshBasicMaterial({ color: 0xd3272e }));
    this.group.add(this.tip);
    car.add(this.group);
    this.reset();
  }

  reset() {
    this.car.updateMatrixWorld(true);
    this.points.forEach((point, i) => {
      point.copy(this.offset).addScaledVector(this.direction, i * this.segmentLength);
      this.car.localToWorld(point);
      this.velocities[i].set(0, 0, 0);
    });
    this.lastAnchor.copy(this.points[0]);
    this.initialized = true;
    this.draw();
  }

  update(dt) {
    if (!(dt > 0)) return;
    this.car.updateMatrixWorld(true);
    const anchor = this.car.localToWorld(this.offset.clone());
    const travel = anchor.clone().sub(this.lastAnchor);
    // Teleports and car resets must not launch the aerial across the track.
    if (travel.length() > this.length * 3) { this.reset(); return; }
    const duration = Math.min(dt, 0.05);
    const steps = Math.max(1, Math.ceil(duration * 120));
    const h = duration / steps;
    const baseVelocity = travel.clone().divideScalar(duration);
    const rotation = this.car.getWorldQuaternion(new THREE.Quaternion());
    const up = this.direction.clone().applyQuaternion(rotation);
    const previous = this.points.map(point => point.clone());
    for (let step = 1; step <= steps; step++) {
      const base = this.lastAnchor.clone().lerp(anchor, step / steps);
      previous.forEach((point, i) => point.copy(this.points[i]));
      this.points[0].copy(base);
      for (let i = 1; i <= this.count; i++) {
        const target = base.clone().addScaledVector(up, i * this.segmentLength);
        const force = target.sub(this.points[i]).multiplyScalar(this.stiffness)
          .addScaledVector(this.velocities[i].clone().sub(baseVelocity), -this.damping);
        force.y -= 2;
        // Air resistance bends the aerial back as speed increases.
        force.addScaledVector(baseVelocity, -0.025 * baseVelocity.length());
        this.velocities[i].addScaledVector(force, h);
        this.points[i].addScaledVector(this.velocities[i], h);
      }
      for (let pass = 0; pass < 6; pass++) {
        this.points[0].copy(base);
        for (let i = 1; i <= this.count; i++) {
          const delta = this.points[i].clone().sub(this.points[i - 1]);
          const distance = delta.length();
          if (distance < 0.000001) continue;
          const correction = delta.multiplyScalar((distance - this.segmentLength) / distance);
          this.points[i].addScaledVector(correction, i === 1 ? -1 : -0.5);
          if (i > 1) this.points[i - 1].addScaledVector(correction, 0.5);
        }
      }
      for (let i = 1; i <= this.count; i++) {
        this.velocities[i].copy(this.points[i]).sub(previous[i]).divideScalar(h);
      }
    }
    this.lastAnchor.copy(anchor);
    this.draw();
  }

  draw() {
    const local = this.points.map(point => this.car.worldToLocal(point.clone()));
    const axis = new THREE.Vector3(0, 1, 0);
    this.rods.forEach((rod, i) => {
      const delta = local[i + 1].clone().sub(local[i]);
      rod.position.copy(local[i]).add(local[i + 1]).multiplyScalar(0.5);
      rod.scale.y = delta.length() / this.segmentLength;
      if (delta.lengthSq() > 0) rod.quaternion.setFromUnitVectors(axis, delta.normalize());
    });
    this.tip.position.copy(local[this.count]);
  }
}

let carSwitchGeneration = 0;
function playCarSwitchSound() {
  const generation = ++carSwitchGeneration;
  const sound = sounds.carSwitch;
  if (muted || !sound.buffer) return;
  const play = () => {
    if (generation !== carSwitchGeneration || muted || raceStarted) return;
    if (sound.isPlaying) sound.stop();
    sound.play();
  };
  // Selection itself is a user gesture, so menu audio also works on phones.
  if (listener.context.state === "suspended") listener.context.resume().then(play).catch(console.warn);
  else if (listener.context.state === "running") play();
}

function loadAmbience(url) {
  if (sounds.ambience.isPlaying) sounds.ambience.stop();
  audioLoader.load(assetUrl(url), (buffer) => {
    sounds.ambience.setBuffer(buffer);
    sounds.ambience.setVolume(0.1);
    sounds.ambience.setLoop(true);
    if (raceStarted && !muted) sounds.ambience.play();
  });
}

    scene.background = new THREE.Color().setRGB(...rgb.map((v) => v / 255), THREE.SRGBColorSpace);

    scene.fog = new THREE.Fog(scene.background, (loaded.info.FOGSTART?.[0] ?? 20000) * RV_SCALE, far);
    camera.far = far;
    camera.updateProjectionMatrix();
    const path = loaded.path;
    if (path.length > 2) {
      curve = makeRaceRoute(path);
      centerline = Array.from({ length: samples }, (_, i) => curve.getPointAt(i / samples));
      tangents = Array.from({ length: samples }, (_, i) => curve.getTangentAt(i / samples).normalize());
      normals = tangents.map((t) => new THREE.Vector3(-t.z, 0, t.x).normalize());
      checkpoints = [0, 45, 90, 135, 180, 225, 270, 315].map((index) => ({ index, position: centerline[index].clone() }));
    } else {
      centerline = [];
      tangents = [];
      normals = [];
      checkpoints = [];
    }
    physics?.dispose();
    physics = new MeshPhysics(loaded.group, loaded.water);
    if (loaded.water) loaded.water.onSplash = () => {
      if (muted || !raceStarted || !sounds.splash.buffer) return;
      if (sounds.splash.isPlaying) sounds.splash.stop();
      sounds.splash.play();
    };
    skidMarks = new SkidMarks(scene);
    powerups = new PowerupSystem(scene, physics, loaded.group, loaded.objects, powerAssets, playPowerSound);

    window.revoltMap = { id: level.id, ...loaded.stats };
    loadAmbience(level.ambience);
    levelLoading = false;
    startBtn.disabled = false;
    startBtn.textContent = "Start Race";
    return true;
  } catch (error) {
    if (generation !== loadGeneration) return false;
    console.error(error);
    startBtn.textContent = "Map could not load";
    document.querySelector("#startDescription").textContent = error.message;
    return false;
  }
}

const powerSounds = new Map();
function playPowerSound(name, position) {
  if (muted || !raceStarted) return;
  const sound = powerSounds.get(name);
  if (!sound?.buffer) return;
  if (sound.isPlaying) sound.stop();
  sound.setVolume(Math.min(0.45, 12 / Math.max(25, position.distanceTo(camera.position))));
  sound.play();
}

async function makeCar(id, name) {
  const root = await loadCar(id, name);
  const sample = engineProfile(root.userData.engineClass).sample;
  if (!engineBuffers.has(sample)) engineBuffers.set(sample, audioLoader.loadAsync(assetUrl(sample)));
  root.userData.engine = new CarEngineAudio(listener, root, await engineBuffers.get(sample));
  scene.add(root);
  return root;
}

function nearestTrackData(position) {
  if (!centerline.length) return { index: 0, lateral: 0 };
  let bestIndex = 0;
  let bestDist = Infinity;
  for (let i = 0; i < samples; i += 1) {
    const dist = position.distanceToSquared(centerline[i]);
    if (dist < bestDist) {
      bestDist = dist;
      bestIndex = i;
    }
  }
  const p = centerline[bestIndex];
  const n = normals[bestIndex];
  const lateral = tempVec.copy(position).sub(p).dot(n);
  return {
    index: bestIndex,
    center: p,
    tangent: tangents[bestIndex],
    normal: n,
    lateral,
    distance: Math.sqrt(bestDist),
  };
}

class CarController {
  constructor(mesh, options = {}) {
    this.mesh = mesh;
    this.name = mesh.name;
    this.isPlayer = options.isPlayer || false;
    this.position = mesh.position;
    this.velocity = new THREE.Vector3();
    this.heading = options.heading ?? 0;
    this.steer = 0;
    this.throttle = 0;
    this.airborne = false;
    this.sliding = false;
    this.bumpCooldown = 0;
    this.aiTargetOffset = options.aiTargetOffset || 0;
    this.aiSpeed = options.aiSpeed || 0.9;
    this.ai = new RaceAI(loadedLevel.aiRoute, this.aiSpeed, mesh.userData.physics);
    this.lap = 1;
    this.finished = false;
    this.nextCheckpoint = 1;
    this.progress = 0;
    this.distanceTravelled = 0;
    this.lastTrackIndex = 0;
    this.placeScore = 0;
    this.resetTo(0, options.startOffset || 0, (samples - (options.startIndex || samples)) / 6);
  }

  resetTo(index, offset = 0, gridRow = 0) {
    skidMarks?.previous.delete(this);
    this.sliding = false;
    if (this.physics !== physics) {
      this.physics = physics;
      this.car = physics.createCar(this.mesh);
    }
    const heading = index && tangents[index] ? Math.atan2(tangents[index].x, tangents[index].z) : (loadedLevel.info.STARTROT?.[0] ?? 0) * Math.PI * 2;
    const forward = new THREE.Vector3(Math.sin(heading), 0, Math.cos(heading));
    const right = new THREE.Vector3(forward.z, 0, -forward.x);
    const p = index && centerline[index] ? centerline[index].clone() : new THREE.Vector3();
    p.addScaledVector(right, offset).addScaledVector(forward, -gridRow * 20);
    const rotation = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), heading);
    let placed = physics.placeCar(this.car, p, rotation);
    if (!placed && this.car.safePose) placed = physics.placeCar(this.car, this.car.safePose.position, this.car.safePose.rotation);
    if (!placed) physics.placeCar(this.car, new THREE.Vector3(), new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), (loadedLevel.info.STARTROT?.[0] ?? 0) * Math.PI * 2));
    this.syncPhysics();
    this.lastTrackIndex = index;
    this.nextCheckpoint = 1;
  }

  restart(index, offset = 0) {
    this.ai = new RaceAI(loadedLevel.aiRoute, this.aiSpeed, this.mesh.userData.physics);
    this.resetTo(0, offset, (samples - (index || samples)) / 6);
    this.lap = 1;
    this.finished = false;
    this.nextCheckpoint = 1;
    this.progress = 0;
    this.distanceTravelled = 0;
    this.placeScore = 0;
    this.bumpCooldown = 0;
  }

  update(dt) {
    if (this.finished || dt === 0) return;
    if (this.isPlayer && resetFade?.active) {
      this.sliding = false; this.throttle = 0; this.steer = 0;
      physics.updateVehicle(this.car, dt, 0, 1, 0, false);
      return;
    }

    const forward = new THREE.Vector3(Math.sin(this.heading), 0, Math.cos(this.heading));
    const right = new THREE.Vector3(forward.z, 0, -forward.x);
    const speed = this.velocity.dot(forward);
    let throttle = 0;
    let brake = 0;
    let steerInput = 0;
    let handbrake = false;

    if (this.isPlayer) {
      throttle = pressed("KeyW") || pressed("ArrowUp") ? 1 : 0;
      brake = pressed("KeyS") || pressed("ArrowDown") ? 1 : 0;
      steerInput = keyboardSteering(pressed("KeyA") || pressed("ArrowLeft"), pressed("KeyD") || pressed("ArrowRight"));
      handbrake = pressed("Space");
    } else if (centerline.length) {
      const controls = this.ai.update(dt, this.position, this.heading, this.velocity, {
        disabled: this.powerups?.disabled > 0,
        upsideDown: new THREE.Vector3(0, 1, 0).applyQuaternion(this.mesh.quaternion).y < 0.25,
        halfExtents: this.car.setup.halfExtents,
        traffic: racers.filter(racer=>racer!==this).map(racer=>({position:racer.position,velocity:racer.velocity,heading:racer.heading,halfExtents:racer.car.setup.halfExtents})),
      });
      throttle = controls.throttle; brake = controls.brake; steerInput = controls.steering;
      if (controls.recovery) {
        const recovery = findAiRecovery(physics, this.ai, controls.recoveryDistance);
        if (recovery) {
          const placed = physics.placeCar(this.car, recovery.position, new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), recovery.heading));
          if (placed) this.ai.acceptRecovery(recovery.distance);
          this.steer = 0; this.syncPhysics();
        }
      }
    }

    this.steer = THREE.MathUtils.lerp(this.steer, steerInput, 1 - Math.exp(-dt * (this.isPlayer ? 12 : 7.5)));
    const trackData = nearestTrackData(this.position);
    const reversing = brake && speed < 2;
    this.throttle = throttle - (reversing ? brake : 0);
    if (this.powerups?.disabled > 0) this.throttle = 0;
    physics.updateVehicle(this.car, dt, this.throttle * (this.powerups?.boost > 0 ? 1.1 : 1), reversing ? 0 : brake, this.steer, handbrake, this.powerups?.slippery > 0 ? 0.025 : 1, this.isPlayer ? 2.1 : 1);
    this.bumpCooldown = Math.max(0, this.bumpCooldown - dt);

    this.updateProgress(trackData);
    this.interact(speed, handbrake);
  }

  syncPhysics() {
    this.position.copy(this.car.body.translation());
    this.mesh.quaternion.copy(this.car.body.rotation());
    this.velocity.copy(this.car.body.linvel());
    const forward = new THREE.Vector3(0, 0, 1).applyQuaternion(this.mesh.quaternion);
    this.heading = Math.atan2(forward.x, forward.z);
    this.airborne = true;
    this.mesh.userData.wheels.forEach((wheel, i) => {
      const suspension = this.car.vehicle.wheelSuspensionLength(i) ?? 0.6;
      wheel.position.y = this.car.setup.wheels[i].position.y - wheel.parent.position.y + 0.6 - suspension;
      setWheelPose(wheel, this.car.vehicle.wheelSteering(i) ?? 0, this.car.vehicle.wheelRotation(i) ?? 0);
      if (this.car.vehicle.wheelIsInContact(i)) this.airborne = false;
    });
    if (this.position.y < physics.bounds.min.y - 50) this.resetTo(this.lastTrackIndex);
  }

  updateProgress(trackData) {
    if (!checkpoints.length) return;
    if (!this.isPlayer) {
      this.lastTrackIndex = trackData.index;
      this.lap = this.ai.laps + 1;
      this.progress = this.ai.distance / this.ai.length;
      this.placeScore = (this.ai.laps + this.progress) * samples;
      if(this.ai.laps>=TOTAL_LAPS&&!this.finished) {
        this.finished=true;
        physics.updateVehicle(this.car,PHYSICS_STEP,0,1,0,false);
        physics.parkCar(this.car);this.syncPhysics();
      }
      return;
    }
    let delta = trackData.index - this.lastTrackIndex;
    if (delta < -samples / 2) delta += samples;
    if (delta > samples / 2) delta -= samples;
    if (delta > 0) this.distanceTravelled += delta;
    this.lastTrackIndex = trackData.index;
    this.progress = trackData.index / samples;

    const checkpoint = checkpoints[this.nextCheckpoint];
    if (this.position.distanceTo(checkpoint.position) < CHECKPOINT_RADIUS) {
      this.nextCheckpoint += 1;
      if (this.nextCheckpoint >= checkpoints.length) this.nextCheckpoint = 0;
    }

    if (trackData.index < 8 && this.nextCheckpoint === 0 && this.velocity.length() > 4) {
      this.lap += 1;
      this.nextCheckpoint = 1;
      if (this.lap > TOTAL_LAPS) {
        this.finished = true;
        this.velocity.multiplyScalar(0.25);
      }
    }

    this.placeScore = (this.lap - 1) * samples + this.distanceTravelled;
  }

  interact(speed, handbrake) {
    this.sliding = isSkidding({ speed, lateralSpeed: this.velocity.dot(new THREE.Vector3(Math.cos(this.heading), 0, -Math.sin(this.heading))), steer: this.steer, handbrake, airborne: this.airborne });
    if (this.isPlayer) {
      const sliding = this.sliding;
      if (sliding && sounds.skid.buffer && !sounds.skid.isPlaying && !muted) sounds.skid.play();
      if ((!sliding || muted) && sounds.skid.isPlaying) sounds.skid.stop();
    }
  }
}

function formatTime(seconds) {
  const mins = Math.floor(seconds / 60).toString().padStart(2, "0");
  const secs = Math.floor(seconds % 60).toString().padStart(2, "0");
  return `${mins}:${secs}`;
}

function updateCamera(dt) {
  const forward = tempVec.set(Math.sin(player.heading), 0, Math.cos(player.heading));
  const speed = player.velocity.length();
  let desired;
  let lookAt;

  if (cameraMode === 0) {
    desired = player.position.clone().addScaledVector(forward, -16 - speed * 0.16).add(new THREE.Vector3(0, 7.5, 0));
    lookAt = player.position.clone().addScaledVector(forward, 11).add(new THREE.Vector3(0, 2.2, 0));
  } else if (cameraMode === 1) {
    desired = player.position.clone().add(new THREE.Vector3(0, 42, 0)).addScaledVector(forward, -4);
    lookAt = player.position.clone().addScaledVector(forward, 5);
  } else {
    desired = player.position.clone().addScaledVector(forward, 3.2).add(new THREE.Vector3(0, 2.2, 0));
    lookAt = player.position.clone().addScaledVector(forward, 28).add(new THREE.Vector3(0, 1.2, 0));
  }

  camera.position.lerp(desired, 1 - Math.exp(-dt * 6));
  if (loadedLevel && cameraMode === 0) {
    const target = player.position.clone().add(new THREE.Vector3(0, 2, 0));
    const direction = camera.position.clone().sub(target);
    obstacleRay.set(target, direction.clone().normalize());
    obstacleRay.far = direction.length();
    const hit = obstacleRay.intersectObject(loadedLevel.group, true)[0];
    if (hit) camera.position.copy(target).addScaledVector(obstacleRay.ray.direction, Math.max(1, hit.distance - 0.8));
  }
  camera.lookAt(lookAt);
}

function updateHud() {
  const speed = Math.round(player.velocity.length() * 2.7);
  const sorted = [...racers].sort((a, b) => b.placeScore - a.placeScore);
  const place = sorted.indexOf(player) + 1;
  speedEl.textContent = speed.toString();
  lapEl.textContent = `${Math.min(player.lap, TOTAL_LAPS)}/${TOTAL_LAPS}`;
  placeEl.textContent = `${place}/${racers.length}`;
  timeEl.textContent = formatTime(elapsedRace);
  const state = player.powerups;
  if (state) {
    const icon = state.bomb > 0 ? POWERUPS[3] : state.rolling > 0 ? POWERUPS[Math.floor(elapsedRace * 12) % 10] : state.held;
    if (icon !== lastPowerIcon) { powerups.drawIcon(powerIcon, icon); lastPowerIcon = icon; }
    powerName.textContent = state.bomb > 0 ? "Bomb" : state.rolling > 0 ? "Selecting..." : state.held?.name ?? "No Pick Up";
    powerStatus.textContent = state.bomb > 0 ? `${state.bomb.toFixed(1)} s` : state.disabled > 0 ? `Power cut: ${state.disabled.toFixed(1)} s` : state.boost > 0 ? `Turbo: ${state.boost.toFixed(1)} s` : state.electro > 0 ? `Pulse: ${state.electro.toFixed(1)} s` : state.shots > 0 ? `${state.shots} / ${state.held.shots}` : "";
    powerBtn.disabled = !state.held || state.rolling > 0 || state.cooldown > 0 || !raceStarted;
    touchControls.setFireEnabled(!powerBtn.disabled);
    debugStatus.textContent = `${powerName.textContent}${powerStatus.textContent ? ` - ${powerStatus.textContent}` : ""}`;
    document.querySelector("#debugUse").disabled = powerBtn.disabled;
  }
}



function drawMinimap() {
  const w = mapCanvas.width;
  const h = mapCanvas.height;
  mapCtx.clearRect(0, 0, w, h);
  mapCtx.fillStyle = "rgba(8, 10, 13, 0.58)";
  mapCtx.fillRect(0, 0, w, h);
  mapCtx.save();
  mapCtx.translate(w / 2, h / 2);
  const bounds = centerline.length ? new THREE.Box3().setFromPoints(centerline) : physics.bounds;
  const center = bounds.getCenter(new THREE.Vector3());
  const span = bounds.getSize(new THREE.Vector3());
  const mapScale = Math.min(w / Math.max(span.x, 1), h / Math.max(span.z, 1)) * 0.8;
  mapCtx.scale(mapScale, mapScale);
  mapCtx.translate(-center.x, -center.z);
  mapCtx.lineWidth = 14;
  mapCtx.lineCap = "round";
  mapCtx.strokeStyle = "rgba(255,255,255,0.18)";
  mapCtx.beginPath();
  centerline.forEach((p, i) => {
    const x = p.x;
    const y = p.z;
    if (i === 0) mapCtx.moveTo(x, y);
    else mapCtx.lineTo(x, y);
  });
  mapCtx.closePath();
  mapCtx.stroke();
  mapCtx.lineWidth = 3;
  mapCtx.strokeStyle = "#f1c94b";
  mapCtx.stroke();
  for (const racer of racers) {
    mapCtx.fillStyle = racer.isPlayer ? "#ff3939" : "#ffffff";
    mapCtx.beginPath();
    mapCtx.arc(racer.position.x, racer.position.z, (racer.isPlayer ? 4 : 3) / mapScale, 0, Math.PI * 2);
    mapCtx.fill();
  }
  mapCtx.restore();
}

function animate() {
  const dt = Math.min(clock.getDelta(), 0.033);
  resetFade?.update(dt);
  resetBtn.disabled = resetFade?.active ?? false;
  if (raceStarted) elapsedRace += dt;

  if (raceStarted && !levelLoading) {
    physicsAccumulator += dt;
    while (physicsAccumulator >= PHYSICS_STEP) {
      for (const racer of racers) racer.update(PHYSICS_STEP);
      physics.step();
      for (const racer of racers) { physics.checkCar(racer.car, PHYSICS_STEP, racers.map(other=>other.car)); racer.syncPhysics(); skidMarks.track(racer); }
      powerups.update(PHYSICS_STEP, racers);
      physicsAccumulator -= PHYSICS_STEP;
    }
  }
  if (raceStarted && !levelLoading) skidMarks.update(dt);
  for (const racer of racers) racer.mesh.userData.engine.update(dt, {
    running: raceStarted && !levelLoading && !(racer.powerups?.disabled > 0),
    muted,
    speed: racer.velocity.length(),
    throttle: racer.finished ? 0 : racer.throttle,
    airborne: racer.airborne,
  });
  loadedLevel?.water?.update(dt, racers.map(racer => racer.car));
  for (const racer of racers) racer.mesh.userData.antenna?.update(dt);
  updateCamera(dt);
  updateHud();
  drawMinimap();

  if (!raceStarted && showroom) showroom.render(renderer, dt, camera.aspect);
  else renderer.render(scene, camera);
  canvas.dataset.view = raceStarted ? "race" : "menu";

    <script type="text/plain" data-game-module="physics.js">
import * as THREE from "three";
import RAPIER from "@dimforge/rapier3d-compat";

let initialization;
export function keyboardSteering(left, right) {
  // Looking forward along +Z, +X is left on the chase camera.
  return Number(left) - Number(right);
}

export function initializePhysics() {
  return initialization ??= RAPIER.init();
}

export function meshTriangles(group) {
  group = group.userData.collisionGroup ?? group;
  group.updateMatrixWorld(true);
  const meshes = [];
  group.traverse((object) => {
    if (!object.isMesh) return;
    for (let parent = object; parent; parent = parent.parent) {
      if (parent.userData.noCollision) return;
    }
    meshes.push(object);
  });
  const vertexCount = meshes.reduce((sum, mesh) => sum + mesh.geometry.attributes.position.count, 0);
  const indexCount = meshes.reduce((sum, mesh) => sum + (mesh.geometry.index?.count ?? mesh.geometry.attributes.position.count), 0);
  const vertices = new Float32Array(vertexCount * 3), indices = new Uint32Array(indexCount);
  const vertex = new THREE.Vector3();
  let vertexOffset = 0, indexOffset = 0;
  for (const mesh of meshes) {
    const position = mesh.geometry.attributes.position, index = mesh.geometry.index;
    for (let i = 0; i < position.count; i++) {
      vertex.fromBufferAttribute(position, i).applyMatrix4(mesh.matrixWorld);
      vertex.toArray(vertices, (vertexOffset + i) * 3);
    }
    for (let i = 0; i < (index?.count ?? position.count); i++) indices[indexOffset++] = vertexOffset + (index ? index.getX(i) : i);
    vertexOffset += position.count;
  }
  return { vertices, indices };
}

// Chassis contacts all terrain; tires contact steep obstacle faces, not the road.
const CHASSIS_GROUPS = (1 << 16) | 3;
const TERRAIN_GROUPS = (1 << 16) | 1;
const TIRE_GROUPS = (2 << 16) | 3;
const OBSTACLE_GROUPS = (2 << 16) | 2;

export class MeshPhysics {
  constructor(group, water = null) {
    this.water = water;
    this.world = new RAPIER.World({ x: 0, y: -42, z: 0 });
    this.world.timestep = 1 / 120;
    this.world.integrationParameters.numSolverIterations = 8;
    this.world.integrationParameters.maxCcdSubsteps = 4;
    const { vertices, indices } = meshTriangles(group);
    this.triangleCount = indices.length / 3;
    this.bounds = new THREE.Box3().setFromArray(vertices);
    // One welded trimesh avoids false collisions at material/texture boundaries.
    this.terrain = this.world.createCollider(RAPIER.ColliderDesc.trimesh(vertices, indices, RAPIER.TriMeshFlags.FIX_INTERNAL_EDGES | RAPIER.TriMeshFlags.DELETE_DEGENERATE_TRIANGLES | RAPIER.TriMeshFlags.ORIENTED).setFriction(0.8).setRestitution(0).setCollisionGroups(TERRAIN_GROUPS));
    const obstacleIndices = [];
    const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
    for (let i = 0; i < indices.length; i += 3) {
      a.fromArray(vertices, indices[i] * 3);
      b.fromArray(vertices, indices[i + 1] * 3).sub(a);
      c.fromArray(vertices, indices[i + 2] * 3).sub(a);
      const normal = b.cross(c).normalize();
      if (Math.abs(normal.y) < 0.65) obstacleIndices.push(indices[i], indices[i + 1], indices[i + 2]);
    }
    this.wheelObstacles = obstacleIndices.length ? this.world.createCollider(
      RAPIER.ColliderDesc.trimesh(vertices, new Uint32Array(obstacleIndices), RAPIER.TriMeshFlags.FIX_INTERNAL_EDGES | RAPIER.TriMeshFlags.DELETE_DEGENERATE_TRIANGLES)
        .setFriction(0.05).setRestitution(0).setCollisionGroups(OBSTACLE_GROUPS)
    ) : null;
    this.world.step();
  }

  groundAt(position, above = 1, below = 20) {
    const ray = new RAPIER.Ray({ x: position.x, y: position.y + above, z: position.z }, { x: 0, y: -1, z: 0 });
    const hit = this.world.castRayAndGetNormal(ray, above + below, false, RAPIER.QueryFilterFlags.EXCLUDE_DYNAMIC);
    return hit && hit.normal.y > 0.15 ? position.y + above - hit.timeOfImpact : null;
  }

  createCar(mesh) {
    const setup = mesh.userData.physics;
    const body = this.world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setCcdEnabled(true).setSoftCcdPrediction(0.5).setLinearDamping(0.15).setAngularDamping(1.5));
    const { halfExtents: size, center } = setup;
    const hull = setup.bodyVertices?.length >= 12 ? RAPIER.ColliderDesc.convexHull(setup.bodyVertices) : null;
    const shapeOffset = hull ? new THREE.Vector3() : center.clone();
    const descriptor = hull ?? RAPIER.ColliderDesc.cuboid(size.x, size.y, size.z).setTranslation(center.x, center.y, center.z);
    const collider = this.world.createCollider(descriptor.setMass(8).setFriction(0.3).setRestitution(0.02).setContactSkin(0.02).setCollisionGroups(CHASSIS_GROUPS), body);
    const vehicle = this.world.createVehicleController(body);
    vehicle.indexUpAxis = 1;
    vehicle.setIndexForwardAxis = 2;
    for (const wheel of setup.wheels) {
      const connection = { x: wheel.position.x, y: wheel.position.y + 0.6, z: wheel.position.z };
      vehicle.addWheel(connection, { x: 0, y: -1, z: 0 }, { x: -1, y: 0, z: 0 }, 0.6, wheel.radius);
      const i = vehicle.numWheels() - 1;
      vehicle.setWheelSuspensionStiffness(i, 70);
      vehicle.setWheelSuspensionCompression(i, 12);
      vehicle.setWheelSuspensionRelaxation(i, 12);
      vehicle.setWheelMaxSuspensionTravel(i, 0.5);
      vehicle.setWheelMaxSuspensionForce(i, 2000);
      vehicle.setWheelFrictionSlip(i, 2.5);
      vehicle.setWheelSideFrictionStiffness(i, 1);
    }
    // Suspension rays provide grip; rounded tire shapes prevent side walls and
    // object edges from entering wheels outside the narrower chassis hull.
    const wheelColliders = setup.wheels.map((wheel) => {
      const radius = wheel.radius * 0.92;
      const halfWidth = wheel.halfWidth ?? wheel.radius * 0.35;
      const tire = RAPIER.ColliderDesc.roundCylinder(halfWidth, radius, Math.min(0.05, radius * 0.1))
        .setRotation(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), Math.PI / 2))
        .setTranslation(wheel.position.x, wheel.position.y, wheel.position.z)
        .setMass(0).setFriction(0.05).setRestitution(0).setContactSkin(0.01).setCollisionGroups(TIRE_GROUPS);
      return this.world.createCollider(tire, body);
    });
    return { body, vehicle, setup, collider, wheelColliders, shapeOffset, safePose: null, embeddedTime: 0, blockedTime: 0, stackedTime: 0, driveIntent: false };
  }

  overlapsCar(car, position, rotation) {
    const center = car.shapeOffset.clone().applyQuaternion(rotation).add(position);
    const bodyCenter = car.setup.center.clone().applyQuaternion(rotation).add(position);
    if (this.terrain.projectPoint(bodyCenter, true).isInside) return true;
    const size=car.setup.halfExtents;
    const bottom=position.y-1,top=bodyCenter.y+size.y+0.05;
    const clearanceCenter=new THREE.Vector3(bodyCenter.x,(bottom+top)/2,bodyCenter.z);
    const clearanceShape=new RAPIER.Cuboid(size.x+0.4,(top-bottom)/2,size.z+0.4);
    if(this.world.intersectionWithShape(clearanceCenter,rotation,clearanceShape,RAPIER.QueryFilterFlags.EXCLUDE_FIXED|RAPIER.QueryFilterFlags.EXCLUDE_KINEMATIC|RAPIER.QueryFilterFlags.EXCLUDE_SENSORS,undefined,car.collider,car.body)) return true;
    if (this.world.intersectionWithShape(center, rotation, car.collider.shape, RAPIER.QueryFilterFlags.EXCLUDE_SENSORS, undefined, car.collider, car.body)) return true;
    return car.wheelColliders.some((tire) => {
      const local = new THREE.Vector3().copy(tire.translationWrtParent());
      const tireCenter = local.applyQuaternion(rotation).add(position);
      const tireRotation = new THREE.Quaternion().copy(rotation).multiply(new THREE.Quaternion().copy(tire.rotationWrtParent()));
      return Boolean(this.world.intersectionWithShape(tireCenter, tireRotation, tire.shape,
        RAPIER.QueryFilterFlags.EXCLUDE_SENSORS, TIRE_GROUPS, tire, car.body));
    });
  }

  placeCar(car, requested, rotation) {
    const spacing = Math.max(4, car.setup.halfExtents.x * 2 + 1);
    const offsets = [new THREE.Vector3()];
    for (let ring = 1; ring <= 6; ring++) for (let i = 0; i < 8; i++) offsets.push(new THREE.Vector3(Math.sin(i * Math.PI / 4) * spacing * ring, 0, Math.cos(i * Math.PI / 4) * spacing * ring));
    for (const offset of offsets) {
      const position = requested.clone().add(offset);
      const floor = this.groundAt(position, 3, 40);
      if (floor === null) continue;
      const clearance = Math.max(0.8, car.setup.halfExtents.y - car.setup.center.y + 0.15);
      for (const lift of [0, 0.5, 1]) {
        position.y = floor + clearance + lift;
        if (this.overlapsCar(car, position, rotation)) continue;
        car.body.setTranslation(position, true); car.body.setRotation(rotation, true);
        car.body.setLinvel({ x: 0, y: 0, z: 0 }, true); car.body.setAngvel({ x: 0, y: 0, z: 0 }, true);
        this.world.propagateModifiedBodyPositionsToColliders();
        car.safePose = { position: position.clone(), rotation: new THREE.Quaternion().copy(rotation) };
        car.embeddedTime = 0; car.blockedTime = 0; car.stackedTime=0;
        return true;
      }
    }
    return false;
  }

  parkCar(car) {
    const position=new THREE.Vector3().copy(car.body.translation()),rotation=new THREE.Quaternion().copy(car.body.rotation());
    const side=new THREE.Vector3(1,0,0).applyQuaternion(rotation);side.y=0;side.normalize();
    for(const distance of [24,-24,36,-36]) {
      if(this.placeCar(car,position.clone().addScaledVector(side,distance),rotation)) return true;
    }
    return false;
  }

  checkCar(car, dt, cars = []) {
    const position = new THREE.Vector3().copy(car.body.translation());
    const rotation = new THREE.Quaternion().copy(car.body.rotation());
    const velocity = car.body.linvel();
    if (![...position.toArray(), ...rotation.toArray(), velocity.x, velocity.y, velocity.z].every(Number.isFinite)) {
      if (car.safePose) this.placeCar(car, car.safePose.position, car.safePose.rotation);
      return;
    }
    const contacts = [
      car.collider.contactCollider(this.terrain, 0),
      ...(this.wheelObstacles ? car.wheelColliders.map((tire) => tire.contactCollider(this.wheelObstacles, 0)) : []),
    ].filter(Boolean);
    const contact = contacts.find((hit) => hit.distance < -0.2) ?? contacts[0];
    const obstacleContact = contacts.some((hit) => Math.abs(hit.normal1.y) < 0.65);
    const upright = new THREE.Vector3(0, 1, 0).applyQuaternion(rotation).y;
    const stationary = Math.hypot(velocity.x, velocity.z) < 2;
    car.blockedTime = stationary && (upright < 0.25 || (car.driveIntent && obstacleContact)) ? car.blockedTime + dt : 0;
    const stacked=cars.some(other=>{
      if(other===car||position.y-other.body.translation().y<1) return false;
      const support=car.collider.contactCollider(other.collider,0.03);
      return support&&support.distance<0.03&&support.normal1.y< -0.5;
    });
    car.stackedTime=stacked?car.stackedTime+dt:0;
    const bodyCenter = car.setup.center.clone().applyQuaternion(rotation).add(position);
    const deeplyEmbedded = (contact && contact.distance < -0.2) || this.terrain.projectPoint(bodyCenter, true).isInside;
    car.embeddedTime = deeplyEmbedded ? car.embeddedTime + dt : 0;
    if ((car.embeddedTime > 0.35 || car.blockedTime > 1.5 || car.stackedTime>0.75) && car.safePose) {
      this.placeCar(car, car.safePose.position, car.safePose.rotation);
      return;
    }
    // Keep a previously clear resting pose, not the latest position pressed into a wall.
    if (!car.collider.contactCollider(this.terrain, 0) && !obstacleContact && !deeplyEmbedded && upright > 0.7 && Math.hypot(velocity.x, velocity.z) > 2 && car.vehicle.numWheels() > 0 && Array.from({ length: car.vehicle.numWheels() }, (_, i) => car.vehicle.wheelIsInContact(i)).filter(Boolean).length >= 2) {
      car.safePose = { position, rotation };
    }
  }

  updateVehicle(car, dt, throttle, brake, steering, handbrake, traction = 1, steeringGain = 1) {
    const waterFraction = this.water?.applyCar(car, dt) ?? 0;
    car.driveIntent = Math.abs(throttle) > 0.1;
    const slippery = traction < 1;
    car.body.setAngularDamping(slippery ? 0.12 : 1.5);
    car.collider?.setFriction(slippery ? 0.015 : 0.3);
    const totalDriveRatio=car.setup.wheels.reduce((sum,wheel)=>sum+((wheel.powered??true)?(wheel.engineRatio??1):0),0);
    for (let i = 0; i < car.vehicle.numWheels(); i++) {
      const front = car.setup.wheels[i].position.z > 0;
      const wheel = car.setup.wheels[i];
      // Give player cars usable lock even when stock ratios are small (Cougar: 0.25).
      const steerRatio = steeringGain > 1 ? Math.max(0.45, wheel.steerRatio ?? 0.45) : (wheel.steerRatio ?? 0.45);
      const steeringLimit = steeringGain > 1 ? 1.05 : 0.8;
      car.vehicle.setWheelSteering(i, (wheel.turnable ?? front) ? THREE.MathUtils.clamp(steering * steerRatio * steeringGain, -steeringLimit, steeringLimit) : 0);
      car.vehicle.setWheelEngineForce(i, (wheel.powered ?? true) ? throttle * 360 * (1 - 0.65 * waterFraction) * (wheel.engineRatio??1) / Math.max(1,totalDriveRatio) : 0);
      car.vehicle.setWheelBrake(i, brake * 18 + (handbrake && !front ? 30 : 0));
      car.vehicle.setWheelFrictionSlip(i, (handbrake && !front ? 0.7 : 2.5) * traction * (1 - 0.6 * waterFraction));
      car.vehicle.setWheelSideFrictionStiffness(i, traction);
    }
    car.vehicle.updateVehicle(dt, RAPIER.QueryFilterFlags.EXCLUDE_DYNAMIC);
    car.wheelColliders.forEach((tire, i) => {
      const wheel = car.setup.wheels[i];
      const suspension = car.vehicle.wheelSuspensionLength(i) ?? 0.6;
      tire.setTranslationWrtParent({ x: wheel.position.x, y: wheel.position.y + 0.6 - suspension, z: wheel.position.z });
      const steeringRotation = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), car.vehicle.wheelSteering(i) ?? 0);
      tire.setRotationWrtParent(steeringRotation.multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), Math.PI / 2)));
    });
  }

  step() { this.world.step(); }
  dispose() { this.world.free(); }
}

import * as THREE from "three";

export function createElectricPulse(car) {
  const size = car.userData.physics?.halfExtents ?? new THREE.Vector3(2, 1, 4);
  const center = car.userData.physics?.center ?? new THREE.Vector3();
  const material = new THREE.ShaderMaterial({
    uniforms: { time: { value: 0 }, strength: { value: 1 } },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide,
    vertexShader: `
      varying vec2 pulseUv;
      varying vec3 pulseNormal;
      varying vec3 pulseView;
      void main() {
        pulseUv = uv;
        vec4 viewPosition = modelViewMatrix * vec4(position, 1.0);
        pulseNormal = normalize(normalMatrix * normal);
        pulseView = normalize(-viewPosition.xyz);
        gl_Position = projectionMatrix * viewPosition;
      }
    `,
    fragmentShader: `
      uniform float time;
      uniform float strength;
      varying vec2 pulseUv;
      varying vec3 pulseNormal;
      varying vec3 pulseView;
      void main() {
        float edge = pow(1.0 - abs(dot(normalize(pulseNormal), normalize(pulseView))), 2.0);
        float zigzag = sin(pulseUv.y * 64.0 + time * 19.0) * 0.7
          + sin(pulseUv.y * 137.0 - time * 27.0) * 0.35;
        float arc = pow(max(0.0, cos(pulseUv.x * 50.2655 + zigzag + time * 3.0)), 45.0);
        float flicker = 0.65 + 0.35 * sin(time * 37.0 + pulseUv.y * 23.0);
        float alpha = strength * (edge * 0.14 + arc * flicker * 0.85);
        vec3 color = mix(vec3(0.08, 0.4, 1.0), vec3(0.65, 0.95, 1.0), arc);
        gl_FragColor = vec4(color, alpha);
      }
    `,
  });
  const shell = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 20), material);
  shell.name = "Animated electro pulse";
  shell.userData.electricPulseFX = true;
  shell.position.copy(center);
  shell.scale.set(size.x * 1.35 + 0.5, size.y * 1.5 + 0.8, size.z * 1.25 + 0.5);
  car.add(shell);
  return shell;
}

export function disposeElectricPulse(car) {
  const shell = car.userData.electricPulse;
  if (!shell) return;
  car.remove(shell);
  shell.geometry.dispose(); shell.material.dispose();
  delete car.userData.electricPulse;
}

import * as THREE from "three";

export const POWERUPS = [

  { id: "firework", name: "Firework", shots: 1, icon: [64, 224], sound: "firefire" },
  { id: "fireworks", name: "Firework Pack", shots: 3, icon: [96, 224], sound: "firefire" },
  { id: "bomb", name: "Bomb", shots: 1, icon: [32, 224], sound: "fuse" },
  { id: "balloons", name: "Water Balloons", shots: 3, icon: [128, 224], sound: "wbombfire" },
  { id: "electro", name: "Electro Pulse", shots: 1, icon: [224, 224], sound: "electrozap" },
  { id: "oil", name: "Oil Slick", shots: 1, icon: [192, 224], sound: "oildrop" },
  { id: "bearing", name: "Ball Bearing", shots: 1, icon: [0, 192], sound: "balldrop" },

  { id: "star", name: "Global Pulse", shots: 1, icon: [96, 192], sound: "starfire" },
];
const WEIGHTS = { first: [10,18,5,10,5,18,18,4,8,9,0], middle: [20,10,10,10,10,10,10,10,10,10,0], last: [40,3,15,2,15,2,2,21,17,2,1], cpu: [20,10,5,10,10,5,15,15,10,10,0] };
export function choosePowerup(place, count, cpu, random = Math.random) {
  const weights = WEIGHTS[cpu ? "cpu" : place === 1 ? "first" : place === count ? "last" : "middle"];

  for (let i = 0; i < weights.length; i++) { roll -= weights[i]; if (roll < 0) return POWERUPS[i]; }

export function createPowerState() {

export class PowerupSystem {
  static async loadAssets() {

    const [fx, icons, explosions] = await Promise.all([bitmap("fxpage1"), bitmap("fxpage2"), bitmap("fxpage3")]);
    const models = {};
    for (const name of ["pickup", "star", "firework", "wbomb", "ball", "fuse"]) {
      const source = parsePrm(await (await fetch(gameAssetUrl(`/models/${name}.m`))).arrayBuffer());
      const mesh = makeMeshes([source], { 0: fx }, [0, 0, 0]);

  constructor(scene, physics, terrain, objects, assets, playSound = () => {}) {

  reset(racers) {

  remove(entity) {

  dispose(racers) { this.reset(racers); this.scene.remove(this.group); }

  restoreCar(racer) {
    disposeElectricPulse(racer.mesh);
    if (racer.mesh.userData.bombFuse) {
      racer.mesh.remove(racer.mesh.userData.bombFuse);
      delete racer.mesh.userData.bombFuse;
    }
    racer.mesh.traverse((o) => { if (o.material?.color && o.userData.powerupColor) o.material.color.copy(o.userData.powerupColor); });
  }

  updateElectricPulse(racer) {
    if (racer.powerups.electro <= 0) { disposeElectricPulse(racer.mesh); return; }
    const shell = racer.mesh.userData.electricPulse ??= createElectricPulse(racer.mesh);

  }

  forward(racer) { return new THREE.Vector3(0, 0, 1).applyQuaternion(racer.mesh.quaternion).normalize(); }

  flash(position, color = 0xffb326, radius = 12) {
    const texture = this.assets.explosions.clone();
    texture.repeat.set(0.125, 0.125); texture.offset.set(0, 0.75); texture.needsUpdate = true;
    const mesh = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, color, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
    mesh.position.copy(position); mesh.scale.setScalar(radius);
    this.group.add(mesh); this.effects.push({ mesh, life: 0.5, radius, texture });
  }

  bolt(from, to) {
    const points = Array.from({ length: 9 }, (_, i) => {
      const point = from.clone().lerp(to, i / 8).add(new THREE.Vector3(0, 2, 0));
      if (i > 0 && i < 8) point.add(new THREE.Vector3(Math.sin(i * 7 + this.time * 20) * 1.4, Math.cos(i * 9) * 1.4, 0));

  }

  explode(position, racers, owner = null, radius = 20) {
    this.flash(position); this.playSound("firebang", position);
    for (const racer of racers) {
      const distance = racer.position.distanceTo(position);
      if (distance > radius || (owner === racer && distance > 6)) continue;
      const direction = racer.position.clone().sub(position); direction.y = 0;
      if (direction.lengthSq() < 0.01) direction.set(1, 0, 0);

  }

  spawnProjectile(racer, kind) {
    const forward = this.forward(racer);
    const mesh = kind === "shockwave" ? new THREE.Mesh(new THREE.SphereGeometry(2, 12, 8), new THREE.MeshBasicMaterial({ color: 0x54cfff, wireframe: true })) : this.assets.models[kind === "balloons" ? "wbomb" : "firework"].clone(true);
    if (kind === "balloons") mesh.scale.setScalar(0.4);
    mesh.position.copy(racer.position).addScaledVector(forward, 12); mesh.position.y += 3;
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), forward);
    this.group.add(mesh);
    const projectileSpeed = kind === "balloons" ? 85 : 105;
    const launchLift = kind === "balloons" ? 26 : 0;
    const entity = { mesh, owner: racer, kind, velocity: forward.multiplyScalar(projectileSpeed).add(racer.velocity), life: kind === "shockwave" ? 10 : 5, unique: kind === "shockwave", bounces: 0, previousVy: launchLift, hitCars: new Set() };
    if (kind === "balloons") {
      entity.body = this.physics.world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(...mesh.position.toArray()).setLinvel(entity.velocity.x, launchLift, entity.velocity.z).setCcdEnabled(true));

  dropHazard(racer, kind) {

    const floor = this.physics.groundAt(position, 5, 40);
    if (floor === null) return;
    position.y = floor + 0.08;
    let mesh;
    if (kind === "clone") mesh = this.assets.models.pickup.clone(true);
    else if (kind === "bearing") { mesh = this.assets.models.ball.clone(true); mesh.scale.setScalar(0.35); position.y += 3.5; }
    else { mesh = new THREE.Mesh(new THREE.CircleGeometry(8, 24), new THREE.MeshBasicMaterial({ color: 0x121017, transparent: true, opacity: 0.85, depthWrite: false })); mesh.rotation.x = -Math.PI / 2; }
    mesh.position.copy(position); this.group.add(mesh);

  fire(racer, racers) {

    const powerup = state.held;
    state.cooldown = 0.35;
    this.playSound(powerup.sound, racer.position);
    if (["shockwave", "firework", "fireworks", "balloons"].includes(powerup.id)) this.spawnProjectile(racer, powerup.id === "fireworks" ? "firework" : powerup.id);
    else if (["oil", "bearing", "clone"].includes(powerup.id)) this.dropHazard(racer, powerup.id);

  debugGive(racer, id) {
    const powerup = POWERUPS.find((item) => item.id === id);

    racer.powerups = createPowerState();

      if (state.rolling > 0) {

  updateProjectiles(dt, racers) {
    for (const projectile of this.projectiles) {

        projectile.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), projectile.velocity.clone().normalize());

      const segment = new THREE.Line3(previous, projectile.mesh.position);
      for (const racer of racers) {
        if (racer === projectile.owner || projectile.hitCars.has(racer)) continue;
        const closest = segment.closestPointToPoint(racer.position, true, new THREE.Vector3());
        if (closest.distanceTo(racer.position) > (projectile.kind === "shockwave" ? 12 : 8)) continue;

        for (const racer of racers) if (racer.position.distanceTo(projectile.mesh.position) < 22) racer.powerups.slippery = 4;
      } else if (projectile.life <= 0 && projectile.kind === "firework") this.explode(projectile.mesh.position, racers, projectile.owner);
    }
    this.projectiles = this.projectiles.filter((projectile) => { if (projectile.life > 0) return true; this.remove(projectile); return false; });
  }

  drawIcon(canvas, powerup) {
    const ctx = canvas.getContext("2d"); ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (!powerup) return;
    const image = this.assets.icons.image, [x, y] = powerup.icon;
    const pixels = new Uint8ClampedArray(32 * 32 * 4);
    for (let row = 0; row < 32; row++) pixels.set(image.data.subarray(((y + row) * image.width + x) * 4, ((y + row) * image.width + x + 32) * 4), row * 128);
    const small = document.createElement("canvas"); small.width = small.height = 32;
    small.getContext("2d").putImageData(new ImageData(pixels, 32, 32), 0, 0);
    ctx.drawImage(small, 0, 0, canvas.width, canvas.height);
  }
}

import * as THREE from "three";

export function makeRaceRoute(points) {
  const curve = new THREE.CurvePath();
  for (let i = 0; i < points.length; i++) curve.add(new THREE.LineCurve3(points[i], points[(i + 1) % points.length]));
  return curve;
}

export function makeAiRoute(path, racingLine) {
  // POS nodes measure race progress; FAN nodes specify the actual driving line.
  return racingLine.length >= 3 ? racingLine : path.length >= 3 ? path : [];
}

export function findAiRecovery(physics, ai, distance) {
  for (let ahead = 0; ahead <= 300; ahead += 10) {
    const routeDistance = Math.min(ai.length - 1, distance + ahead);
    const routePosition = ai.at(routeDistance);
    for (const radius of [0, 8, 16, 32, 64, 128]) for (let side = 0; side < (radius ? 8 : 1); side++) {
      const position = routePosition.clone().add(new THREE.Vector3(Math.sin(side * Math.PI / 4) * radius, 0, Math.cos(side * Math.PI / 4) * radius));
      const floor = physics.groundAt(position, 15, 60);
      if (floor !== null && Math.abs(floor - position.y) < 40) {
        position.y = floor + 0.8;
        const direction = ai.at(routeDistance + 8).sub(ai.at(routeDistance));
        return { position, distance: routeDistance, heading: Math.atan2(direction.x, direction.z) };
      }
    }
  }
  return null;
}

export function trafficSpeedLimit(position, heading, velocity, halfExtents, traffic) {
  const forward = new THREE.Vector3(Math.sin(heading),0,Math.cos(heading));
  const side = new THREE.Vector3(forward.z,0,-forward.x);
  const speed = Math.max(0,velocity.dot(forward));
  let limit = Infinity;
  for(const other of traffic) {
    const delta=other.position.clone().sub(position),size=other.halfExtents;
    if(Math.abs(delta.y)>halfExtents.y+size.y+2) continue;
    const ahead=delta.dot(forward);
    if(ahead<=0||ahead>halfExtents.z+size.z+15+speed*1.2) continue;
    const angle=(other.heading??heading)-heading;
    const width=Math.abs(Math.cos(angle))*size.x+Math.abs(Math.sin(angle))*size.z;
    if(Math.abs(delta.dot(side))>halfExtents.x+width+0.6) continue;
    const length=Math.abs(Math.cos(angle))*size.z+Math.abs(Math.sin(angle))*size.x;
    const gap=ahead-halfExtents.z-length;
    const leadSpeed=Math.max(0,other.velocity.dot(forward));
    limit=Math.min(limit,Math.max(0,leadSpeed+2*(gap-5-speed*0.18)));
    if(gap<3) limit=0;
  }
  return limit;
}

export class RaceAI {
  constructor(points, pace = 0.9, setup = null) {
    this.points = points;
    this.pace = pace;
    const wheels=setup?.wheels??[];
    this.wheelbase=wheels.length?Math.max(...wheels.map(wheel=>wheel.position.z))-Math.min(...wheels.map(wheel=>wheel.position.z)):8;
    this.steeringAngle=Math.max(0.1,...wheels.filter(wheel=>wheel.turnable).map(wheel=>wheel.steerRatio));
    if(!wheels.length) this.steeringAngle=0.45;
    this.lengths = points.map((point, i) => point.distanceTo(points[(i + 1) % points.length]));
    this.offsets = [0];
    this.lengths.forEach((length) => this.offsets.push(this.offsets.at(-1) + length));
    this.length = this.offsets.at(-1);
    this.reset();
  }

  reset() { this.segment = 0; this.distance = 0; this.laps = 0; this.stalled = 0; this.reversing = 0; this.recoveryCount = 0; this.recoveryCooldown = 0; this.trafficWait=0; }

  acceptRecovery(distance) {
    this.distance = distance;
    this.segment = this.offsets.findIndex((offset, i) => i < this.points.length && distance < this.offsets[i + 1]);
    if (this.segment < 0) this.segment = this.points.length - 1;
  }

  at(distance) {
    distance = ((distance % this.length) + this.length) % this.length;
    let segment = this.offsets.findIndex((offset, i) => i < this.points.length && distance < this.offsets[i + 1]);
    if (segment < 0) segment = 0;
    const t = (distance - this.offsets[segment]) / Math.max(0.01, this.lengths[segment]);
    return this.points[segment].clone().lerp(this.points[(segment + 1) % this.points.length], t);
  }

  update(dt, position, heading, velocity, { disabled = false, upsideDown = false, traffic = [], halfExtents = new THREE.Vector3(3,2,6) } = {}) {
    if (this.points.length < 3 || this.length < 1) return { throttle: 0, brake: 1, steering: 0 };
    let segment = this.segment;
    let line = new THREE.Line3(this.points[segment], this.points[(segment + 1) % this.points.length]);
    let t = line.closestPointToPointParameter(position, false);
    const nextLine = new THREE.Line3(this.points[(segment + 1) % this.points.length], this.points[(segment + 2) % this.points.length]);
    const endpointDistance = position.distanceTo(line.end);
    if (t >= 1 || (endpointDistance < 10 && nextLine.closestPointToPointParameter(position, false) > 0)) {
      segment = (segment + 1) % this.points.length;
      if (segment === 0) this.laps++;
      this.segment = segment;
      line = nextLine;
      t = line.closestPointToPointParameter(position, false);
    }
    const previous = this.distance;
    const projected = this.offsets[segment] + THREE.MathUtils.clamp(t, 0, 1) * this.lengths[segment];
    this.distance = segment === 0 && previous > this.length * 0.5 ? projected : Math.max(previous, projected);
    let advance = this.distance - previous;

import * as THREE from "three";

export function poolVolumes(objects) {
  const surfaces = objects.filter(object => object.type === 47 && object.flags[0] === 1);
  return objects.filter(object => object.type === 68).map(object => {
    const half = new THREE.Vector3(...object.flags.slice(0, 3).map(value => Math.abs(value) * 0.1));
    const surface = surfaces.reduce((best, candidate) => {
      const distance = Math.hypot(candidate.position.x - object.position.x, candidate.position.z - object.position.z);
      return !best || distance < best.distance ? { object: candidate, distance } : best;
    }, null);
    return {
      center: object.position.clone(), half,
      height: surface?.object.position.y ?? object.position.y + half.y,
      surfacePosition: surface?.object.position.clone() ?? new THREE.Vector3(object.position.x, object.position.y + half.y, object.position.z),
    };
  }).filter(volume => volume.half.x > 0 && volume.half.y > 0 && volume.half.z > 0);
}

export function submergedFraction(point, volume, bodyHeight) {
  if (Math.abs(point.x - volume.center.x) > volume.half.x ||
      Math.abs(point.z - volume.center.z) > volume.half.z ||
      point.y < volume.center.y - volume.half.y - bodyHeight) return 0;
  return THREE.MathUtils.clamp((volume.height - point.y) / bodyHeight, 0, 1);
}

export class PoolWater {
  constructor(objects, model) {
    this.volumes = poolVolumes(objects);
    this.group = new THREE.Group();
    this.group.name = "Swimming pool water";
    this.group.userData.noCollision = true;
    this.time = 0;
    this.ripples = [];
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(model.vertices.flatMap(vertex => [
      vertex.position[0] * 0.1, -vertex.position[1] * 0.1, vertex.position[2] * 0.1,
    ]));
    const indices = [];
    for (const polygon of model.polygons) {
      const [a, b, c, d] = polygon.indices;
      indices.push(a, b, c);
      if (polygon.flags & 1) indices.push(a, c, d);
    }
    geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    geometry.setIndex(indices);
    this.material = new THREE.ShaderMaterial({
      uniforms: { time: { value: 0 } },
      transparent: true, depthWrite: false, side: THREE.DoubleSide,
      vertexShader: `
        uniform float time;
        varying vec2 waterPosition;
        varying float wave;
        void main() {
          vec3 p = position;
          waterPosition = p.xz;
          wave = sin(p.x * 0.12 + time * 1.5) * cos(p.z * 0.16 - time);
          p.y += wave * 0.18;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
        }
      `,
      fragmentShader: `
        uniform float time;
        varying vec2 waterPosition;
        varying float wave;
        void main() {
          float ripple = sin(waterPosition.x * 0.45 + waterPosition.y * 0.32 + time * 2.0);
          float highlight = pow(max(0.0, ripple), 10.0);
          vec3 color = mix(vec3(0.02, 0.35, 0.52), vec3(0.18, 0.72, 0.80), wave * 0.5 + 0.5);
          color += highlight * vec3(0.22, 0.28, 0.28);
          gl_FragColor = vec4(color, 0.67);
        }
      `,
    });
    for (const volume of this.volumes) {
      const surface = new THREE.Mesh(geometry, this.material);
      surface.position.copy(volume.surfacePosition);
      surface.renderOrder = 2;
      this.group.add(surface);
    }
  }

  applyCar(car, dt) {
    const position = new THREE.Vector3().copy(car.body.translation());
    const rotation = new THREE.Quaternion().copy(car.body.rotation());
    const size = car.setup.halfExtents;
    const height = Math.max(0.8, size.y * 2);
    const mass = car.body.mass();
    let fraction = 0, activeVolume = null;
    for (const x of [-0.7, 0.7]) for (const z of [-0.7, 0.7]) {
      const point = new THREE.Vector3(car.setup.center.x + size.x * x,
        car.setup.center.y - size.y, car.setup.center.z + size.z * z)
        .applyQuaternion(rotation).add(position);
      let submerged = 0;
      for (const volume of this.volumes) {
        const amount = submergedFraction(point, volume, height);
        if (amount > submerged) { submerged = amount; activeVolume = volume; }
      }
      fraction += submerged / 4;
      // Sample the underside, but apply lift at the chassis center plane.
      // Applying full-submersion lift below the center of mass tips the car over.
      const liftPoint = new THREE.Vector3(car.setup.center.x + size.x * x,
        car.setup.center.y, car.setup.center.z + size.z * z)
        .applyQuaternion(rotation).add(position);
      if (submerged > 0) car.body.applyImpulseAtPoint({ x: 0, y: mass * 42 * 1.18 * submerged * dt / 4, z: 0 }, liftPoint, true);
    }
    const previous = car.waterFraction ?? 0;
    car.waterFraction = fraction;
    if (fraction > 0) {
      const velocity = car.body.linvel();
      const horizontal = 1 - Math.exp(-3 * fraction * dt);
      const vertical = 1 - Math.exp(-4 * fraction * dt);
      car.body.applyImpulse({ x: -mass * velocity.x * horizontal, y: -mass * velocity.y * vertical, z: -mass * velocity.z * horizontal }, true);
      const angular = car.body.angvel();
      const angularDrag = Math.exp(-2 * fraction * dt);
      car.body.setAngvel({ x: angular.x * angularDrag, y: angular.y * angularDrag, z: angular.z * angularDrag }, true);
      if (previous <= 0 && activeVolume) {
        this.addRipple(position, activeVolume.height);
        this.onSplash?.();
      }
    }
    return fraction;
  }

  addRipple(position, height) {
    const material = new THREE.MeshBasicMaterial({ color: 0xc0efff, transparent: true, opacity: 0.75, side: THREE.DoubleSide, depthWrite: false });
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.7, 1, 24), material);
    ring.rotation.x = -Math.PI / 2;
    ring.position.set(position.x, height + 0.24, position.z);
    ring.renderOrder = 3;
    this.group.add(ring);
    this.ripples.push({ ring, age: 0 });
  }

  update(dt, cars = []) {
    this.time += dt;
    this.material.uniforms.time.value = this.time;
    for (const car of cars) {
      car.waterWakeTime = (car.waterWakeTime ?? 0) + dt;
      const position = car.body.translation();
      const velocity = car.body.linvel();
      if (car.waterFraction > 0.05 && Math.hypot(velocity.x, velocity.z) > 2 && car.waterWakeTime > 0.25) {
        const volume = this.volumes.find(volume => submergedFraction(position, volume, 2) > 0);
        if (volume) this.addRipple(position, volume.height);
        car.waterWakeTime = 0;
      }
    }
    this.ripples = this.ripples.filter(ripple => {
      ripple.age += dt;
      ripple.ring.scale.setScalar(1 + ripple.age * 8);
      ripple.ring.material.opacity = Math.max(0, 0.75 * (1 - ripple.age));
      if (ripple.age < 1) return true;
      this.group.remove(ripple.ring);
      ripple.ring.geometry.dispose(); ripple.ring.material.dispose();
      return false;
    });
  }
}

import * as THREE from "three";

// NCP stores each face as a surface plane plus three or four edge planes.
// Unlike the render mesh, these are the track author's intended solid surfaces.
export function collisionMesh(buffer, origin = [0, 0, 0]) {
  const view = new DataView(buffer);
  if (buffer.byteLength < 2) throw new Error("Invalid Re-Volt NCP header");
  const count = view.getUint16(0, true);
  if (buffer.byteLength < 2 + count * 112) throw new Error("Truncated Re-Volt NCP faces");
  const positions = [];
  for (let face = 0; face < count; face++) {
    const offset = 2 + face * 112, flags = view.getUint32(offset, true);
    if (flags & (8 | 128)) continue; // Camera-only and no-collision faces.
    const planes = Array.from({ length: 5 }, (_, i) => {
      const at = offset + 8 + i * 16;
      return { normal: new THREE.Vector3(view.getFloat32(at, true), view.getFloat32(at + 4, true), view.getFloat32(at + 8, true)), distance: view.getFloat32(at + 12, true) };
    });
    const corners = [], edgeCount = flags & 1 ? 4 : 3;
    for (let edge = 0; edge < edgeCount; edge++) {
      const a = planes[0], b = planes[edge + 1], c = planes[(edge + 1) % edgeCount + 1];
      const cross = b.normal.clone().cross(c.normal);
      const determinant = a.normal.dot(cross);
      if (Math.abs(determinant) < 1e-8) continue;
      const point = cross.multiplyScalar(-a.distance)
        .addScaledVector(c.normal.clone().cross(a.normal), -b.distance)
        .addScaledVector(a.normal.clone().cross(b.normal), -c.distance)
        .divideScalar(determinant);
      if (!point.toArray().every(Number.isFinite)) throw new Error("Invalid Re-Volt NCP plane");
      corners.push(new THREE.Vector3((point.x - origin[0]) * 0.1, -(point.y - origin[1]) * 0.1, (point.z - origin[2]) * 0.1));
    }
    if (corners.length < 3) continue;
    const normal = new THREE.Vector3(planes[0].normal.x, -planes[0].normal.y, planes[0].normal.z);
    const winding = corners[1].clone().sub(corners[0]).cross(corners[2].clone().sub(corners[0]));
    if (winding.dot(normal) < 0) corners.reverse();
    for (let i = 1; i < corners.length - 1; i++) positions.push(...corners[0].toArray(), ...corners[i].toArray(), ...corners[i + 1].toArray());
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  return new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }));
}
